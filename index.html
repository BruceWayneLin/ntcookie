<script>
  /* ================= 連結設定 =================
     'line'          → 開啟 LINE 官方帳號聊天室
     'line:一段文字'  → 開啟聊天室，並自動帶入這段文字
     其他             → 網址（站內頁面用檔名即可）              */
  const LINKS = {
    character:    'cookies.html?g=character',               // 卡通・收涎 造型餅乾（系列單片選購；沒有上架的系列時顯示「客製請聯絡」）
    birthday:     'cookies.html?g=birthday',                // 慶生・抓週 造型餅乾
    meringue:     'meringue.html',                          // 馬林糖一口酥（線上下單）
    canele:       'canele.html',                            // N.T Canelé 可麗露專區（線上下單）
    contact:      'line',                                   // 聯絡客服
    reservations: 'reserve.html',                           // 預約／訂購：先選日期 → 購物車 → 留言 → 出單
    store:        'shop.html',                              // 線上商店
    portfolio:    'https://www.instagram.com/nt.cookie/',   // 作品集 → IG
    orders:       'orders.html',                            // 我的訂單：訂單進度・付款查詢
  };
  /* ============================================ */
  document.querySelectorAll('[data-link]').forEach((a) => {
    const v = LINKS[a.dataset.link];
    a.href = v === 'line' ? NTC.chatUrl('') : v.startsWith('line:') ? NTC.chatUrl(v.slice(5)) : v;
  });
  NTC.refreshCart();
</script>
