<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N.T Cookie × N.T Canelé｜客製糖霜餅乾・可麗露</title>
<meta name="description" content="N.T Cookie × N.T Canelé — 客製糖霜餅乾 × 豪宅裡の可麗露。造型訂製・節慶禮盒・活動甜點。">
<meta name="theme-color" content="#f5ebe6">
<meta property="og:type" content="website">
<meta property="og:title" content="N.T Cookie × N.T Canelé">
<meta property="og:description" content="客製糖霜餅乾 × 豪宅裡の可麗露｜造型訂製・節慶禮盒・活動甜點">
<meta property="og:url" content="https://brucewaynelin.github.io/ntcookie/">
<meta property="og:image" content="https://brucewaynelin.github.io/ntcookie/assets/banner.png">
<meta property="og:image:width" content="1199">
<meta property="og:image:height" content="386">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/banner.webp" type="image/webp">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: #f2e8e3; }
  body {
    margin: 0;
    min-height: 100vh;
    /* room for the pinned menu so the last cards can scroll clear of it */
    padding-bottom: calc(min(100vw, 1199px) * 270 / 1199 + env(safe-area-inset-bottom, 0px));
    background: #f2e8e3;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* The page IS the design (top 1199 × 1056: banner + cards), scaled to the screen width.
     The design itself sits underneath as the background; each slice is laid on top at
     its crop-coordinates.csv position, so every width looks exactly like the design.
     The bottom menu is pinned to the bottom of the screen (see .dock). */
  .page {
    position: relative;
    max-width: 1199px;
    margin: 0 auto;
    background-color: #f2e8e3;
    background-image: url(assets/design-top.jpg);
    background-image: image-set(url(assets/design-top.webp) type("image/webp"), url(assets/design-top.jpg) type("image/jpeg"));
    background-size: 100% 100%;
  }
  .page::before { content: ""; display: block; padding-top: calc(1056 / 1199 * 100%); }

  .slot {
    position: absolute;
    left:   calc(var(--x) / 1199 * 100%);
    top:    calc(var(--y) / 1056 * 100%);   /* 1056 = page height in design px */
    width:  calc(var(--w) / 1199 * 100%);
    height: calc(var(--h) / 1056 * 100%);
    display: block;
    /* each card's own corner radius (≈ 36 design px), so a pressed card keeps its shape */
    border-radius: calc(var(--r, 0) / var(--w) * 100%) / calc(var(--r, 0) / var(--h) * 100%);
    overflow: hidden;
  }
  .slot img { display: block; width: 100%; height: 100%; }

  /* pinned bottom menu: same size and side/bottom margins as in the design (x 5…1194, 23 px below) */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: linear-gradient(rgba(242, 232, 227, 0), #f0e5df 18%, #e9ddd6);
  }
  .dock-inner { max-width: 1199px; margin: 0 auto; }
  .menu-bar {
    position: relative; display: block;
    margin: calc(14 / 1199 * 100%) calc(5 / 1199 * 100%) calc(23 / 1199 * 100%) calc(5 / 1199 * 100%);
    border-radius: calc(34 / 1189 * 100%) / calc(34 / 233 * 100%);
    overflow: hidden;
  }
  .menu-bar img { display: block; width: 100%; height: auto; }
  .menu-bar a {
    position: absolute; top: 0; bottom: 0;
  }
  /* divider positions measured in 10-bottom-menu.png: x = 290 / 587 / 897 of 1189 */
  .menu-bar a:nth-of-type(1) { left: 0;      width: 24.39%; }
  .menu-bar a:nth-of-type(2) { left: 24.39%; width: 24.98%; }
  .menu-bar a:nth-of-type(3) { left: 49.37%; width: 26.07%; }
  .menu-bar a:nth-of-type(4) { left: 75.44%; width: 24.56%; }

  /* press / hover feedback only — the resting look is the design, untouched */
  .card { transition: transform .15s ease, filter .15s ease; }
  .card:active { transform: scale(.985); filter: brightness(.97); }
  .menu-bar a:active { background: rgba(110, 60, 40, .08); }
  @media (hover: hover) {
    .card:hover { filter: brightness(1.03); }
    .menu-bar a:hover { background: rgba(110, 60, 40, .045); }
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  a:focus-visible { outline: 3px solid #b0604a; outline-offset: -3px; }

  .toast {
    position: fixed; left: 50%; z-index: 20;
    bottom: calc(min(100vw, 1199px) * 290 / 1199 + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px);
    padding: 10px 18px; border-radius: 999px;
    background: rgba(74, 42, 30, .92); color: #fff; font-size: 15px; letter-spacing: .04em;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main class="page">
  <h1 class="sr-only">N.T Cookie × N.T Canelé — 客製糖霜餅乾 × 豪宅裡の可麗露</h1>

  <!-- positions = crop-coordinates.csv (left, top, width, height) -->
  <div class="slot" style="--x:0; --y:0; --w:1199; --h:386">
    <picture>
      <source srcset="assets/banner.webp" type="image/webp">
      <img src="assets/banner.png" width="1199" height="386" fetchpriority="high"
           alt="N.T Cookie × N.T Canelé　客製糖霜餅乾 × 豪宅裡の可麗露　造型訂製・節慶禮盒・活動甜點">
    </picture>
  </div>

  <nav aria-label="商品分類">
    <a class="slot card" data-link="character" href="#" style="--x:5; --y:407; --w:590; --h:294; --r:36">
      <picture><source srcset="assets/card-character.webp" type="image/webp">
      <img src="assets/card-character.png" width="590" height="294" alt="卡通・收涎 造型餅乾"></picture>
    </a>
    <a class="slot card" data-link="birthday" href="#" style="--x:605; --y:407; --w:590; --h:294; --r:36">
      <picture><source srcset="assets/card-birthday.webp" type="image/webp">
      <img src="assets/card-birthday.png" width="590" height="294" alt="慶生 造型餅乾"></picture>
    </a>
    <a class="slot card" data-link="chinese" href="#" style="--x:5; --y:713; --w:590; --h:307; --r:36">
      <picture><source srcset="assets/card-chinese.webp" type="image/webp">
      <img src="assets/card-chinese.png" width="590" height="307" alt="中國風 造型餅乾"></picture>
    </a>
    <a class="slot card" data-link="canele" href="#" style="--x:605; --y:713; --w:590; --h:307; --r:36">
      <picture><source srcset="assets/card-canele.webp" type="image/webp">
      <img src="assets/card-canele.png" width="590" height="307" alt="N.T Canelé 可麗露專區"></picture>
    </a>
  </nav>
</main>

<div class="dock">
  <div class="dock-inner">
    <nav class="menu-bar" aria-label="服務">
      <picture><source srcset="assets/menu-bar.webp" type="image/webp">
      <img src="assets/menu-bar.png" width="1189" height="233" alt=""></picture>
      <a data-link="contact" href="#"><span class="sr-only">聯絡客服（訂製諮詢）</span></a>
      <a data-link="reservations" href="#"><span class="sr-only">預約／訂購（檔期查詢）</span></a>
      <a data-link="store" href="#"><span class="sr-only">線上商店（直接下單）</span></a>
      <a data-link="portfolio" href="#"><span class="sr-only">作品集（更多案例）</span></a>
    </nav>
  </div>
</div>

<div class="toast" role="status" aria-live="polite"></div>

<script>
  /* ================= 連結設定 =================
     把網址填進引號裡就會生效；留空 = 點了會顯示「即將開放」。
     'line'          → 開啟 LINE 官方帳號聊天室
     'line:一段文字'  → 開啟聊天室，並自動帶入這段文字（客人按送出即可）   */
  const LINE_ID = '@ntcookie';        // LINE 官方帳號 ID，含 @
  const LINKS = {
    character:    '',                 // 卡通・收涎 造型餅乾
    birthday:     '',                 // 慶生 造型餅乾
    chinese:      '',                 // 中國風 造型餅乾
    canele:       '',                 // N.T Canelé 可麗露專區
    contact:      'line',             // 聯絡客服（訂製諮詢）
    reservations: 'line:您好，我想預約／查詢檔期', // 預約／訂購（檔期查詢）
    store:        '',                 // 線上商店（直接下單）
    portfolio:    '',                 // 作品集（更多案例）
  };
  /* ============================================ */

  function resolve(value) {
    if (!value) return null;
    if (value === 'line' || value.startsWith('line:')) {
      if (!LINE_ID) return null;
      const text = value.startsWith('line:') ? value.slice(5) : '';
      return 'https://line.me/R/oaMessage/' + encodeURIComponent(LINE_ID) + '/' +
             (text ? '?' + encodeURIComponent(text) : '');
    }
    return value;
  }

  const toast = document.querySelector('.toast');
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  document.querySelectorAll('[data-link]').forEach((a) => {
    const url = resolve(LINKS[a.dataset.link]);
    if (url) {
      a.href = url;
    } else {
      a.addEventListener('click', (e) => { e.preventDefault(); showToast('即將開放，敬請期待'); });
    }
  });
</script>
</body>
</html>
