<meta name="description" content="大包裝每包超過 200 g，每包至少 50 顆｜雙重酥脆・香濃不膩。每款馬林糖搭配專屬的香酥餅乾底。原味奶油、小山園抹茶、法芙娜可可、天然紫薯、香濃起司、奶油可可。">

<body><main class="bags-page">
<h1 class="sr-only">馬林糖一口酥大包裝</h1>
<div class="bags-hero">
  <img src="assets/v2/02-meringue/bags/hero.webp" width="1024" height="447" alt="馬林糖一口酥，每包至少 50 顆。法式手工，酥脆輕盈。">
  <span class="bags-weight">大包裝 超過 200 g</span>
</div>
  <nav class="pack-nav" id="packs" aria-label="選擇包裝">
    <a href="meringue.html#packs">小罐裝<span>約 120 g</span></a>
    <a href="meringue-bags.html#packs" aria-current="page">大包裝<span>超過 200 g</span></a>
  </nav>
<section aria-label="口味選擇" class="bags-grid" id="bags" aria-busy="true"></section>
<a class="nt-back" href="shop.html"><i aria-hidden="true"></i>返回商店</a>
</main>
<script src="js/config.js?v=packs2"></script><script src="js/app.js?v=1121i"></script><script src="js/shop.js?v=1122a"></script>
<script>
NTC.mountCartBar();
const grid = document.getElementById('bags');
NTC.catalog().then(catalog => {
  const bags = catalog.products.filter(p => p.category === 'meringue' && p.unit === '包');
  for (const product of bags) {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.id = product.id;
    button.disabled = product.soldOut;
    button.setAttribute('aria-label', product.name + '，每包 ' + product.price + ' 元' + (product.soldOut ? '，售完' : ''));
    const art = product.card && product.cardPrice === product.price && product.cardName === product.name;
    const photo = new Image(); photo.alt = ''; photo.src = NTC.asset(art ? product.card : product.photo);
    button.append(photo);
    if (!art) {
      button.classList.add('bag-custom');
      const caption = document.createElement('span'); caption.textContent = product.name + '　' + NTC.money(product.price) + '／包';
      button.append(caption);
    }
    if (product.soldOut) {
      const sold = document.createElement('span'); sold.className = 'bag-sold'; sold.textContent = '售完'; button.append(sold);
    }
    button.onclick = () => NTC.openProduct(product);
    grid.append(button);
  }
  if (!bags.length) grid.textContent = '目前沒有上架的大包裝口味。';
}).catch(() => { grid.textContent = '口味暫時無法載入，請重新整理。'; }).finally(() => grid.setAttribute('aria-busy', 'false'));
</script></body></html>
