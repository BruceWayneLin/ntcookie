<body><main class="bags-page">

  <header class="meringue-banner">
    <div class="meringue-toolbar">
      <a class="circle-btn" data-return-to-jars href="meringue.html#packs" aria-label="返回上一頁"><span aria-hidden="true">←</span></a>
      <span class="meringue-brand">N.T Cookie × N.T Canelé</span>
      <a class="circle-btn" id="banner-cart" href="cart.html" aria-label="購物車"><span class="badge" data-cart-count></span></a>
      <button class="circle-btn" id="menu" type="button" aria-label="選單"><span aria-hidden="true">☰</span></button>
    </div>
    <div class="meringue-art" data-edit-ban="page-meringue" data-edit-label="馬林糖頁最上面的大圖（小罐裝、大包裝兩頁一起）"><img src="assets/v2/02-meringue/jar-and-bag-banner.jpg" width="1755" height="896" alt="馬林糖一口酥送禮小點，小罐禮盒與大包裝。法式手工，酥脆輕盈，甜而不膩。">

  </nav>
<section aria-label="口味選擇" class="bags-grid" id="bags" aria-busy="true"></section>
<a class="nt-back" data-return-to-jars href="meringue.html#packs"><i aria-hidden="true"></i>返回上一頁</a>

<script src="js/config.js?v=1124-owner-canele"></script><script src="js/app.js?v=1123-canele-mask"></script><script src="js/shop.js?v=1123k"></script>
<script>
const jarsUrl = new URL('meringue.html#packs', location.href);
const referrer = document.referrer ? new URL(document.referrer) : null;
for (const link of document.querySelectorAll('[data-return-to-jars]')) {
  link.addEventListener('click', event => {
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    if (history.length > 1 && referrer?.origin === jarsUrl.origin && referrer.pathname === jarsUrl.pathname) {
      history.back();
    } else {
      location.replace(link.href);
    }
  });
}
NTC.$('#menu').onclick = NTC.openMenu;
NTC.$('#banner-cart').insertAdjacentHTML('afterbegin', NTC.CART_SVG);
NTC.mountCartBar();
const grid = document.getElementById('bags');
NTC.catalog().then(catalog => {
  const bags = catalog.products.filter(p => p.category === 'meringue' && p.unit === '包');
  for (const product of bags) {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.id = product.id;
    button.disabled = product.soldOut;
    button.setAttribute('aria-label', product.name + '，每包 ' + product.price + ' 元' + (product.soldOut ? '，售完' : ''));
    const cardOnly = !product.photo && product.card && product.cardPrice === product.price && product.cardName === product.name;
    if (product.photo || cardOnly) {
      const photo = new Image();
      photo.alt = '';
      photo.src = NTC.asset(product.photo || product.card);
      button.append(photo);
    }
    if (!cardOnly) {
      button.classList.add('bag-custom');
      const flavor = product.name.replace(/\s*[（(]\s*大包裝\s*[）)]\s*$/u, '').trim();
      const caption = document.createElement('span');
      caption.className = 'bag-caption';
      const name = document.createElement('span');
      name.className = 'bag-flavor';
      const note = flavor.match(/[（(][^（）()]+[）)]$/u);
      if (note) {
        name.append(flavor.slice(0, note.index));
        const detail = document.createElement('small');
        detail.textContent = note[0];
        name.append(detail);
      } else {
        name.textContent = flavor;
      }
      const size = document.createElement('span');
      size.className = 'bag-size';
      size.textContent = '（大包裝）';
      const price = document.createElement('span');
      price.className = 'bag-price';
      price.textContent = NTC.money(product.price) + '／包';
      caption.append(name, size, price);
      button.append(caption);
    }
    if (product.soldOut) {
      const sold = document.createElement('span'); sold.className = 'bag-sold'; sold.textContent = '售完'; button.append(sold);
    }
    button.onclick = () => NTC.openProduct(product);
    grid.append(button);
  }
  if (!bags.length) grid.textContent = '目前沒有上架的大包裝口味。';
}).catch(() => { grid.textContent = '口味暫時無法載入，請重新整理。'; }).finally(() => grid.setAttribute('aria-busy', 'false'));
</script><script>/* 11-23 i: the owner's own picture at the top of this page; remembered on this phone so the next visit shows it straight away */
(function () {
  const art = document.querySelector('.meringue-art'); const im = art && art.querySelector('img'); if (!im) return;
  const orig = { src: im.getAttribute('src'), alt: im.alt, w: im.getAttribute('width'), h: im.getAttribute('height') };
  const hero = (map) => {
    const src = map && typeof map['page-meringue'] === 'string' ? map['page-meringue'] : '';
    if (src) {
      const u = NTC.asset(src);
      if (im.getAttribute('src') !== u) { im.removeAttribute('width'); im.removeAttribute('height'); im.src = u; }
      im.alt = '馬林糖一口酥'; art.classList.add('own');
    } else if (art.classList.contains('own')) {
      im.src = orig.src; im.alt = orig.alt; im.setAttribute('width', orig.w); im.setAttribute('height', orig.h); art.classList.remove('own');
    }
  };
  try { hero(JSON.parse(localStorage.getItem('ntc-banners') || '{}')); } catch (e) { /* nothing remembered on this phone yet */ }
  NTC.catalog().then((c) => { const b = (c.settings && c.settings.banners) || {}; hero(b); try { localStorage.setItem('ntc-banners', JSON.stringify(b)); } catch (e) { /* */ } }).catch(() => {});
})();
</script>
