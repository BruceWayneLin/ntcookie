<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>購物車・結帳｜N.T Cookie × N.T Canelé</title>
<meta name="theme-color" content="#f8ede7">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=1119k">
</head>
<body>
<header class="topbar">
  <button class="circle-btn" id="back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1>購物車・結帳</h1>
  <a class="circle-btn" href="orders.html" aria-label="我的訂單"><svg viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6"/></svg></a>
</header>
<main class="wrap" id="app"><div class="spinner"></div></main>

<script src="js/config.js?v=1119k"></script>
<script src="js/app.js?v=1119k"></script>
<script src="js/shop.js?v=1119k"></script>
<script>
(async function () {
  const { $, esc, money, asset } = NTC;
  const app = $('#app');
  $('#back').onclick = NTC.back;
  let cat;
  try { cat = await NTC.catalog(); } catch (e) { app.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const S = cat.settings;
  const form = { date: NTC.date.get(), payment: '', note: '', contact: { name: '', phone: '', address: '' } };
  const saved = (() => { try { return JSON.parse(localStorage.getItem('ntc-contact') || 'null'); } catch (e) { return null; } })();
  if (saved) form.contact = { ...form.contact, ...saved };
  const pays = [
    ['linepay', 'LINE Pay', '用 LINE Pay 付款（可綁信用卡、LINE Points 折抵）'],
    ['ecpay', '信用卡／ATM 轉帳／超商代碼', '由綠界科技安全付款'],
    ['transfer', '銀行轉帳（匯款）', '下單後顯示匯款帳號，轉帳後回報末五碼'],
  ].filter(([k]) => S.payments[k]);
  form.payment = pays.length ? pays[0][0] : '';

  let me = null; // LINE member
  const loadMe = async () => {
    if (!(await NTC.loggedIn())) return;
    try {
      const r = await NTC.api('/me'); me = r.user;
      if (r.contact && !saved) form.contact = { ...form.contact, ...r.contact };
    } catch (e) { /* token expired etc. */ }
  };
  await loadMe();

  function render() {
    const items = NTC.cart.items();
    if (!items.length) {
      app.innerHTML = `<div class="empty"><img src="assets/v2/01-canele/photo-01-original.webp" alt=""><p style="font:900 18px var(--serif)">購物車是空的</p>
        <p class="note">逛逛我們的手作甜點吧 ♡</p><div class="row" style="justify-content:center;margin-top:16px;gap:10px">
        <a class="btn small" href="canele.html">可麗露專區</a><a class="btn small ghost" href="meringue.html">馬林糖一口酥</a></div></div>`;
      return;
    }
    const pc = NTC.priceCart(items, cat);
    const fee = pc.shipping.fee; const total = pc.total;
    const frozen = pc.shipping.parts.find((x) => x.kind === 'frozen'); const ambient = pc.shipping.parts.find((x) => x.kind === 'ambient');
    const shipRows = pc.shipping.parts.map((x) => `<div class="row"><span>${x.kind === 'frozen' ? '❄️ ' : x.kind === 'cookie' ? '🍪 ' : ''}${esc(x.label)}${x.kind === 'frozen' ? `（${x.units} 盒${x.parcels > 1 ? `・${x.parcels} 件包裹` : ''}）` : x.kind === 'cookie' ? `（${x.units} 片）` : ''}</span><span class="sp"></span><span>${x.fee ? money(x.fee) : '免運'}</span></div>`).join('');
    const shipNote = [frozen ? `可麗露皆採冷凍宅配寄送${frozen.parcels > 1 ? `；單件包裹最多 ${frozen.max} 盒，這張訂單會拆成 ${frozen.parcels} 件寄出，運費依各件盒數計算` : ''}。` : '',
      frozen && ambient ? '馬林糖一口酥為常溫，會和冷凍的可麗露分開寄送。' : '',
      frozen && pc.shipping.parts.some((x) => x.kind === 'cookie') ? '造型餅乾為常溫寄送，會和冷凍的可麗露分開寄出。' : ''].filter(Boolean).join('');
    const dateOk = NTC.dateRules(S, cat.fullDates).ok(form.date);
    // the cart list (quantities, remove) is the same whether or not the shop is taking orders
    const cartPanel = (numbered) => `<section class="panel"><h2>${numbered ? '<span class="n">1</span>' : ''}購物車</h2>
        <div id="lines">${pc.lines.map((l) => `
          <div class="line-item" data-i="${l.idx}">
            <img class="th" src="${esc(asset(l.photo))}" alt="">
            <div class="info"><div class="nm">${esc(l.name)}</div>${l.detail ? `<div class="dt">${esc(l.detail)}</div>` : ''}
              <div class="row" style="margin-top:8px"><div class="st"></div><span class="sp"></span><span class="pr">${money(l.subtotal)}</span></div>
              ${l.error ? `<p class="err">${esc(l.error)}</p>` : ''}
              <button class="rm" type="button">移除</button></div>
          </div>`).join('')}</div>
        <div class="row" style="margin-top:6px;gap:8px"><a class="btn small ghost" href="canele.html">＋ 可麗露</a><a class="btn small ghost" href="meringue.html">＋ 馬林糖</a><a class="btn small ghost" href="cookies.html?g=character">＋ 造型餅乾</a></div>
      </section>`;
    const wireLines = () => app.querySelectorAll('.line-item').forEach((row) => {
      const i = +row.dataset.i; const l = pc.lines.find((x) => x.idx === i);
      NTC.stepper(row.querySelector('.st'), { value: l.qty, min: Math.min(l.min, l.qty), onChange: (v) => { NTC.cart.setQty(i, v); keep(); render(); } });
      row.querySelector('.st').classList.add('sm');
      row.querySelector('.rm').onclick = () => { NTC.cart.remove(i); keep(); render(); };
    });
    if (S.pauseOrders) { // shop not taking orders: the cart still works (+/−, remove), only the checkout is closed
      app.innerHTML = `${S.notice ? `<div class="panel note" style="background:#fff6ec">${esc(S.notice)}</div>` : ''}
        ${cartPanel(false)}
        <section class="panel totals"><div class="row"><span>商品小計</span><span class="sp"></span><span>${money(pc.subtotal)}</span></div>
          <div class="row"><span>運費</span><span class="sp"></span><span>${pc.shipping.fee ? money(pc.shipping.fee) : '免運'}</span></div>
          <div class="row" style="border-top:1px dashed #ead7cc;margin-top:6px;padding-top:10px"><b>合計</b><span class="sp"></span><span class="grand">${money(pc.total)}</span></div></section>
        <section class="panel" style="text-align:center"><p style="font:900 19px var(--serif);margin:4px 0 6px">目前暫停接單 ♡</p>
          <p class="note" style="margin:0 0 14px">恢復接單時會在 LINE 通知大家。有任何問題歡迎直接聊天詢問。</p>
          <a class="btn line block" href="${NTC.chatUrl('您好，我想詢問')}">LINE 聊天詢問</a></section>`;
      wireLines();
      return;
    }
    const testBanner = S.preview ? `<div class="panel note" style="background:#eef4fb;border-color:#c9dcf2"><b>🔧 店家測試模式</b>　你已用店家身分登入，可以實際下單測試（這張單會標成「店家測試單」，後台可以刪）。<br>客人現在看到的是：<b>${S.preview.closed ? '「目前暫停接單」，不能下單' : S.preview.testMode ? '「用 LINE 傳訂單給店家」' : '跟你一樣的結帳畫面'}</b>。</div>` : '';
    app.innerHTML = `
      ${testBanner}${S.notice ? `<div class="panel note" style="background:#fff6ec">${esc(S.notice)}</div>` : ''}
      ${cartPanel(true)}

      <section class="panel"><h2><span class="n">2</span>${esc(S.dateLabel || '日期')}</h2>
        <p class="note" style="margin:-4px 0 10px">${esc(S.dateNote || '手工製作，需要準備時間。')}<br>最早可預約 ${NTC.fmtDate(NTC.dateRules(S).min)}。${form.date && dateOk ? `已選 <b>${NTC.fmtDate(form.date)}</b>` : '請選擇日期'}</p>
        <div id="cal"></div>
      </section>

      <section class="panel"><h2><span class="n">3</span>收件資料</h2>
        <div id="member" style="margin:-2px 0 12px">${me
          ? `<div class="who">${me.picture ? `<img src="${esc(me.picture)}" alt="">` : ''}<span>已用 LINE「${esc(me.name)}」下單，資料會記住，下次不用再填</span></div>`
          : `<button class="btn line block" id="lineLogin" type="button">用 LINE 登入・自動帶入資料</button><p class="note" style="margin:8px 0 0">不登入也可以直接填寫下單。</p>`}</div>
        <label class="field"><span>收件人姓名（請填真實姓名）</span><input id="f-name" autocomplete="name" value="${esc(form.contact.name)}" maxlength="40" placeholder="例如：王小明">
          <small class="note" style="display:block;margin-top:6px">黑貓送達時會核對收件人，請填<b>真實姓名</b>，不要用 LINE 暱稱，以免無人收件或被退回。</small></label>
        <label class="field"><span>手機</span><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(form.contact.phone)}" maxlength="20" placeholder="09xx-xxx-xxx"></label>
        <label class="field"><span>收件地址</span><input id="f-addr" autocomplete="street-address" value="${esc(form.contact.address)}" maxlength="160" placeholder="縣市＋區＋路名門牌"></label>
        <div class="totals" id="shipbox" style="margin-top:4px;padding:10px 12px;border-radius:12px;background:#fbf3ee">
          <div style="font-weight:700;font-size:13px;color:var(--ink2);margin-bottom:2px">配送方式（僅提供宅配）</div>${shipRows}
          ${shipNote ? `<p class="note" style="margin:6px 0 0">${esc(shipNote)}</p>` : ''}${S.freeShippingOver > 0 ? `<p class="note" style="margin:6px 0 0">滿 ${money(S.freeShippingOver)} 免運</p>` : ''}</div>
      </section>

      <section class="panel"><h2><span class="n">4</span>備註（留言給店家）</h2>
        <p class="note" style="margin:-4px 0 8px">有什麼想跟店家說的都可以寫在這裡，店家會在訂單上看到。</p>
        <label class="field" style="margin:0"><span class="sr-only">備註</span><textarea id="f-note" maxlength="500" placeholder="${pc.lines.some((l) => l.temp === 'cookie') ? '例如：皮卡丘上想加名字「小美」、送禮用、希望收件時段…' : '例如：送禮用、想放卡片、希望收件時段、其他需求…'}">${esc(form.note)}</textarea></label>
      </section>

      <section class="panel"><h2><span class="n">5</span>付款方式</h2>
        ${pays.length ? pays.map(([k, t, d]) => `<button type="button" class="opt pay ${k === form.payment ? 'on' : ''}" data-k="${k}"><span class="dot"></span><span class="t">${t}<small>${d}</small></span></button>`).join('')
          : '<p class="note" style="margin:0">線上付款準備中 ♡ 請按下面的按鈕，把這張訂單用 LINE 傳給我們，確認後會告訴您付款方式。</p>'}
      </section>

      <section class="panel totals">
        <div class="row"><span>商品小計</span><span class="sp"></span><span>${money(pc.subtotal)}</span></div>
        <div class="row"><span>運費</span><span class="sp"></span><span>${fee ? money(fee) : '免運'}</span></div>
        <div class="row" style="border-top:1px dashed #ead7cc;margin-top:6px;padding-top:10px"><b>合計</b><span class="sp"></span><span class="grand">${money(total)}</span></div>
        <p class="err" id="formErr" hidden></p>
        ${pays.length
          ? `<button class="btn block" id="submit" style="margin-top:12px">確認下單・${money(total)}</button>
             <p class="note" style="margin:10px 0 0;text-align:center">${NTC.inLine() ? '下單後會在聊天室留一則訂單摘要給店家' : '下單後可在「我的訂單」查看進度'}</p>`
          : `<button class="btn line block" id="chatOrder" style="margin-top:12px">用 LINE 傳訂單給店家・${money(total)}</button>`}
      </section>`;

    wireLines();
    NTC.calendar($('#cal'), { settings: S, fullDates: cat.fullDates, value: form.date, onChange: (d) => { form.date = d; NTC.date.set(d); keep(); render(); } });
    app.querySelectorAll('.opt.pay').forEach((b) => (b.onclick = () => { keep(); form.payment = b.dataset.k; render(); }));
    const ll = $('#lineLogin'); if (ll) ll.onclick = () => { keep(); persist(); NTC.login(); };
    if ($('#submit')) $('#submit').onclick = () => submit(pc);
    if ($('#chatOrder')) $('#chatOrder').onclick = () => chatOrder(pc, fee, total);
  }
  // keep what was typed when the page re-renders
  function keep() {
    if (!$('#f-name')) return;
    form.contact = { name: $('#f-name').value.trim(), phone: $('#f-phone').value.trim(), address: $('#f-addr').value.trim() };
    form.note = $('#f-note').value;
  }
  function persist() { try { localStorage.setItem('ntc-contact', JSON.stringify(form.contact)); } catch (e) { /* ignore */ } }
  function fail(msg) { const e = $('#formErr'); e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: 'center', behavior: 'smooth' }); }

  function checkForm(pc) {
    if (!pc.valid) return pc.lines.find((l) => l.error)?.error || '購物車有問題，請檢查';
    if (!NTC.dateRules(S, cat.fullDates).ok(form.date)) return `請選擇${S.dateLabel || '日期'}`;
    if (!form.contact.name) return '請填收件人姓名';
    if (!/^[0-9+\-() ]{8,20}$/.test(form.contact.phone)) return '請填正確的手機號碼';
    if (!form.contact.address) return '請填收件地址';
    return '';
  }
  // while online payment isn't open yet: send the whole order as a LINE message to the shop
  function chatOrder(pc, fee, total) {
    keep();
    const err = checkForm(pc); if (err) return fail(err);
    persist();
    const text = ['您好，我想訂購：', ...pc.lines.map((l) => `・${l.name} ×${l.qty}${l.it.type === 'canele-assorted' || l.temp === 'cookie' ? `（${l.detail}）` : ''}　${money(l.subtotal)}`),
      `運費 ${fee ? money(fee) : '免運'}／合計 ${money(total)}`, `${S.dateLabel || '日期'}：${NTC.fmtDate(form.date)}`,
      `收件人：${form.contact.name} ${form.contact.phone}`, `地址：${form.contact.address}`, form.note ? `備註：${form.note}` : ''].filter(Boolean).join('\n');
    if (NTC.inLine() && window.liff.sendMessages) {
      window.liff.sendMessages([{ type: 'text', text }]).then(() => { NTC.toast('已傳到聊天室，我們會盡快回覆您 ♡', 3500); setTimeout(() => window.liff.closeWindow(), 1500); })
        .catch(() => { location.href = NTC.chatUrl(text); });
      return;
    }
    location.href = NTC.chatUrl(text);
  }
  async function submit(pc) {
    keep();
    if (!pc.valid) return fail(pc.lines.find((l) => l.error)?.error || '購物車有問題，請檢查');
    if (!NTC.dateRules(S, cat.fullDates).ok(form.date)) return fail(`請選擇${S.dateLabel || '日期'}`);
    if (!form.contact.name) return fail('請填收件人姓名');
    if (!/^[0-9+\-() ]{8,20}$/.test(form.contact.phone)) return fail('請填正確的手機號碼');
    if (!form.contact.address) return fail('請填收件地址');
    if (!form.payment) return fail('請選擇付款方式');
    persist();
    NTC.loading(true, '送出訂單中…');
    try {
      const r = await NTC.api('/orders', { method: 'POST', body: {
        items: NTC.cart.items(), date: form.date, contact: form.contact, note: form.note,
        payment: form.payment, returnBase: location.href, inLine: false,
      } });
      // remember the order in this browser (guests find it again from 我的訂單)
      try { const list = JSON.parse(localStorage.getItem('ntc-orders') || '[]'); list.unshift({ no: r.orderNo, t: r.token, total: r.total, at: Date.now() }); localStorage.setItem('ntc-orders', JSON.stringify(list.slice(0, 30))); } catch (e) { /* ignore */ }
      NTC.cart.clear(); NTC.date.set('');
      if (NTC.inLine() && window.liff.sendMessages) { await window.liff.sendMessages([{ type: 'text', text: r.summary }]).catch(() => {}); }
      const n = r.next;
      if (n.type === 'redirect') { NTC.loading(true, '前往 LINE Pay…'); location.href = n.url; return; }
      if (n.type === 'form') {
        NTC.loading(true, '前往付款頁…');
        const f = document.createElement('form'); f.method = 'POST'; f.action = n.action;
        Object.entries(n.fields).forEach(([k, v]) => { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i); });
        document.body.appendChild(f); f.submit(); return;
      }
      location.href = n.url.replace(/^.*\/(order\.html.*)$/, '$1') + '&new=1';
    } catch (e) { NTC.loading(false); fail(e.message); }
  }
  render();
  document.addEventListener('ntc:cart', () => { /* other tab changed the cart */ });
})();
</script>
</body>
</html>
