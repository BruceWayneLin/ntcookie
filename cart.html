<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">

<script>/* stale-page guard, part 1 (see js/app.js) */try{(function(d){var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(n&&n.transferSize>0)return;d.className+=' vchk';setTimeout(function(){d.classList.remove('vchk')},1200)})(document.documentElement)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>購物車・結帳｜N.T Cookie × N.T Canelé</title>
<meta name="theme-color" content="#faf4ed">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/app.css?v=1123-meringue-cookie">
<link rel="stylesheet" href="css/checkout.css?v=1121i">
</head>
<body class="checkout">
<header class="topbar">
  <button class="circle-btn" id="back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1>購物車・結帳</h1>
  <a class="circle-btn" href="orders.html" aria-label="我的訂單"><svg viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6"/></svg></a>
</header>
<main class="wrap" id="app"><div class="spinner" role="status"><span class="sr-only">載入購物車中</span></div></main>

<script src="js/config.js?v=1123-meringue-cookie"></script>
<script src="js/app.js?v=1123-canele-mask"></script>
<script src="js/shop.js?v=1123k"></script>
<script>
(async function () {
  const { $, esc, money, asset } = NTC;
  const app = $('#app');
  $('#back').onclick = NTC.back;
  let cat;
  try { cat = await NTC.catalog(); }
  catch (e) {
    app.innerHTML = `<section class="checkout-state"><h2>購物車暫時無法載入</h2><p>${esc(e.message)}</p>
      <button class="checkout-primary" id="retry" type="button">重新載入</button></section>`;
    $('#retry').onclick = () => location.reload();
    return;
  }
  const S = cat.settings;
  const dates = NTC.dateRules(S, cat.fullDates);
  const form = {
    date: NTC.date.get(), payment: '', note: '', noteOpen: false, dateOpen: false, shippingOpen: false,
    contact: { name: '', phone: '', address: '' },
  };
  let sending = false;
  const saved = (() => { try { return JSON.parse(localStorage.getItem('ntc-contact') || 'null'); } catch (e) { return null; } })();
  if (saved) form.contact = { ...form.contact, ...saved };
  const pays = [
    ['linepay', 'LINE Pay', '用 LINE Pay 付款（可綁信用卡、LINE Points 折抵）'],
    ['ecpay', '信用卡／ATM 轉帳／超商代碼', '由綠界科技安全付款'],
    ['transfer', '銀行轉帳（匯款）', '下單後顯示匯款帳號，轉帳後回報末五碼'],
  ].filter(([k]) => S.payments[k]);
  form.payment = pays.length ? pays[0][0] : '';

  let me = null; // LINE member
  const loadMe = async () => {
    if (!(await NTC.loggedIn())) return;
    try {
      const r = await NTC.api('/me'); me = r.user;
      if (r.contact && !saved) form.contact = { ...form.contact, ...r.contact };
    } catch (e) { /* token expired etc. */ }
  };
  await loadMe();

  const dateLabel = esc(S.dateLabel || '希望到貨日期');
  const dateText = () => dates.ok(form.date) ? NTC.fmtDate(form.date) : '尚未選擇';
  const orderMoney = (value) => 'NT' + money(value);
  const error = (id) => `<p class="err checkout-error" id="${id}-error" hidden></p>`;

  function render() {
    const items = NTC.cart.items();
    app.classList.toggle('checkout-has-dock', !!items.length && !S.pauseOrders);
    if (!items.length) {
      app.innerHTML = `<section class="checkout-state">
        <img src="assets/v2/01-canele/photo-01-original.webp" width="192" height="120" alt="">
        <h2>購物車是空的</h2><p>挑一份手作甜點，為今天加點甜。</p>
        <a class="checkout-primary" href="shop.html">繼續逛逛</a>
      </section>`;
      return;
    }

    const pc = NTC.priceCart(items, cat);
    const { fee, parts } = pc.shipping;
    const frozen = parts.find((part) => part.kind === 'frozen');
    const splitShipping = frozen && parts.length > 1;
    const productList = `<section class="checkout-section" id="cart-items">
      <div class="checkout-section-head">
        <h2 id="items-heading" tabindex="-1" aria-describedby="items-error">${S.pauseOrders ? '' : '<span aria-hidden="true">1</span>'}選購商品</h2>
        <a class="checkout-text-link" href="shop.html">繼續選購</a>
      </div>
      ${error('items')}
      <div id="lines">${pc.lines.map((line) => `
        <div class="line-item" data-i="${line.idx}">
          ${line.photo ? `<img class="th" src="${esc(asset(line.photo))}" width="58" height="58" alt="">` : ''}
          <div class="info">
            <div class="checkout-item-heading"><span class="nm">${esc(line.name)}</span><span class="pr">${orderMoney(line.subtotal)}</span></div>
            ${line.detail ? `<div class="dt">${esc(line.detail)}</div>` : ''}
            <div class="checkout-item-controls">
              <div class="st" role="group" aria-label="${esc(line.name)}數量"></div>
              <button class="rm checkout-text-link" type="button" aria-label="移除${esc(line.name)}">移除</button>
            </div>
            ${line.error ? `<p class="err checkout-line-error">${esc(line.error)}</p>` : ''}
          </div>
        </div>`).join('')}</div>
      <dl class="checkout-breakdown">
        <div><dt>商品小計</dt><dd>${orderMoney(pc.subtotal)}</dd></div>
        <div><dt>宅配運費</dt><dd>${fee ? orderMoney(fee) : '免運'}</dd></div>
      </dl>
      ${parts.length ? `<details class="checkout-shipping"${form.shippingOpen ? ' open' : ''}>
        <summary>配送明細</summary>
        <dl>${parts.map((part) => `<div><dt>${esc(part.label)}${part.parcels > 1 ? `（${part.parcels} 件）` : ''}</dt><dd>${part.fee ? orderMoney(part.fee) : '免運'}</dd></div>`).join('')}</dl>
        ${frozen && frozen.parcels > 1 ? `<p class="note">冷凍宅配每件最多 ${frozen.max} 盒，超過會分箱計費。</p>` : ''}
      </details>` : ''}
      ${splitShipping ? '<p class="note checkout-shipping-note">冷凍與常溫甜點會分開寄送。</p>' : ''}
      ${S.freeShippingOver > 0 ? `<p class="note checkout-shipping-note">滿 ${orderMoney(S.freeShippingOver)} 免運。</p>` : ''}
      ${S.pauseOrders ? `<p class="checkout-paused-total">合計（含運） <strong>${orderMoney(pc.total)}</strong></p>` : ''}
    </section>`;

    if (S.pauseOrders) {
      app.innerHTML = `<section class="checkout-pause">
        <h2>目前暫停線上接單</h2>
        <p>${esc(S.notice || '購物車仍會保留。有問題或想查詢檔期，歡迎用 LINE 聯絡我們。')}</p>
        <a class="checkout-primary" href="${NTC.chatUrl('您好，我想詢問訂購')}">用 LINE 聯絡店家</a>
      </section>${productList}`;
      wireLines(pc);
      return;
    }

    const testBanner = S.preview ? `<aside class="checkout-notice"><strong>店家測試模式</strong>　這筆訂單會標記為店家測試單。
      客人目前看到的是：${S.preview.closed ? '暫停接單' : S.preview.testMode ? '用 LINE 傳訂單給店家' : '一般結帳'}。</aside>` : '';
    app.innerHTML = `${testBanner}${S.notice ? `<aside class="checkout-notice">${esc(S.notice)}</aside>` : ''}
      <form id="checkout-form" novalidate>
        ${productList}
        <section class="checkout-section">
          <div class="checkout-section-head"><h2><span aria-hidden="true">2</span>配送資料</h2></div>
          <details id="arrival" class="checkout-disclosure checkout-arrival" ${form.dateOpen ? 'open' : ''}>
            <summary aria-describedby="arrival-error"><span>${dateLabel}<strong id="arrival-date">${dateText()}</strong></span><span class="checkout-summary-action" id="arrival-action">${dates.ok(form.date) ? '更改' : '選擇日期'}</span></summary>
            <p class="note checkout-date-note">${esc(S.dateNote || '每一份甜點都是接單後手工製作。')}</p>
            <div id="cal"></div>
          </details>
          ${error('arrival')}
          <div class="checkout-member" id="member">${me
            ? `<div class="who">${me.picture ? `<img src="${esc(me.picture)}" alt="">` : ''}<span>已用 LINE「${esc(me.name)}」登入</span></div>`
            : '<span>可直接填寫，也可用 LINE 帶入資料。</span><button class="checkout-text-link" id="lineLogin" type="button">LINE 登入</button>'}</div>
          <label class="field" for="f-name"><span>收件人姓名</span><input id="f-name" autocomplete="name" value="${esc(form.contact.name)}" maxlength="40" placeholder="請填真實姓名" aria-describedby="f-name-help f-name-error" required>
            <small class="note" id="f-name-help">請填真實姓名，方便宅配核對。</small></label>
          ${error('f-name')}
          <label class="field" for="f-phone"><span>手機</span><input id="f-phone" type="tel" autocomplete="tel" value="${esc(form.contact.phone)}" maxlength="20" placeholder="09xx-xxx-xxx" aria-describedby="f-phone-error" required></label>
          ${error('f-phone')}
          <label class="field" for="f-addr"><span>收件地址</span><input id="f-addr" autocomplete="street-address" value="${esc(form.contact.address)}" maxlength="160" placeholder="縣市＋區＋路名門牌" aria-describedby="f-addr-error" required></label>
          ${error('f-addr')}
          <details id="order-note" class="checkout-disclosure checkout-note"${form.noteOpen ? ' open' : ''}>
            <summary><span>留言給店家 <small>（選填）</small></span></summary>
            <label class="field"><span class="sr-only">留言給店家</span><textarea id="f-note" maxlength="500" rows="2" placeholder="${pc.lines.some((line) => line.temp === 'cookie') ? '例如：造型餅乾想加的名字、送禮需求' : '例如：送禮用、想放卡片、其他需求'}">${esc(form.note)}</textarea></label>
          </details>
        </section>
        <section class="checkout-section" aria-labelledby="payment-heading">
          <div class="checkout-section-head"><h2 id="payment-heading" tabindex="-1"><span aria-hidden="true">3</span>${pays.length ? '付款方式' : '送出訂購需求'}</h2></div>
          ${pays.length ? `<fieldset class="checkout-payment">
            <legend class="sr-only">付款方式</legend>
            ${pays.map(([key, title, description]) => `<label><input type="radio" name="payment" value="${key}" ${key === form.payment ? 'checked' : ''}><span><strong>${title}</strong><small>${description}</small></span></label>`).join('')}
          </fieldset><p class="note checkout-payment-note">下單後可在「我的訂單」查看進度。</p>`
            : '<p class="note checkout-payment-note">透過 LINE 將這筆訂購需求傳給店家。確認後，店家會提供付款方式。</p>'}
          <p id="formErr" class="err checkout-error" tabindex="-1" role="alert" hidden></p>
        </section>
        <div class="checkout-dock">
          <div class="checkout-total"><span>合計（含運）</span><strong>${orderMoney(pc.total)}</strong></div>
          <button type="submit" class="checkout-primary" id="${pays.length ? 'submit' : 'chatOrder'}">${pays.length ? '確認下單' : '用 LINE 傳送'}</button>
        </div>
      </form>`;

    wireLines(pc);
    NTC.calendar($('#cal'), { settings: S, fullDates: cat.fullDates, value: form.date, onChange: (date) => {
      form.date = date;
      NTC.date.set(date);
      $('#arrival-date').textContent = dateText();
      $('#arrival-action').textContent = '更改';
      $('#arrival').open = false;
      clearError('arrival');
      $('#arrival summary').focus({ preventScroll: true });
    } });
    const checkout = $('#checkout-form');
    checkout.addEventListener('change', (event) => {
      if (event.target.name === 'payment') form.payment = event.target.value;
    });
    checkout.addEventListener('input', (event) => {
      if (event.target.hasAttribute('aria-invalid')) clearError(event.target.id);
    });
    const login = $('#lineLogin');
    if (login) login.onclick = () => { keep(); persist(); NTC.login(); };
    checkout.onsubmit = (event) => {
      event.preventDefault();
      if (sending) return;
      if (pays.length) submit(pc);
      else chatOrder(pc, fee, pc.total);
    };
  }

  function wireLines(pc) {
    const rows = [...app.querySelectorAll('.line-item')];
    rows.forEach((row, index) => {
      const line = pc.lines[index];
      const stepper = row.querySelector('.st');
      NTC.stepper(stepper, { value: line.qty, min: Math.min(line.min, line.qty), onChange: (value) => {
        const buttons = [...stepper.querySelectorAll('button')];
        const focused = buttons.indexOf(document.activeElement);
        keep();
        NTC.cart.setQty(line.idx, value);
        render();
        const next = app.querySelectorAll('.line-item')[index];
        const same = next?.querySelectorAll('.stepper button')[focused];
        const control = same && !same.disabled ? same : next?.querySelector('.stepper button:not(:disabled)');
        control?.focus({ preventScroll: true });
      } });
      row.querySelector('.rm').onclick = () => {
        keep();
        NTC.cart.remove(line.idx);
        render();
        const remaining = app.querySelectorAll('.rm');
        (remaining[Math.min(index, remaining.length - 1)] || $('.checkout-state a'))?.focus({ preventScroll: true });
      };
    });
  }

  function keep() {
    form.shippingOpen = !!$('.checkout-shipping')?.open;
    if (!$('#f-name')) return;
    form.dateOpen = $('#arrival').open;
    form.noteOpen = $('#order-note').open;
    form.contact = { name: $('#f-name').value, phone: $('#f-phone').value, address: $('#f-addr').value };
    form.note = $('#f-note').value;
  }

  function persist() {
    try { localStorage.setItem('ntc-contact', JSON.stringify(form.contact)); } catch (e) { /* private mode */ }
  }

  function clearError(id) {
    const message = $(`#${id}-error`);
    if (message) message.hidden = true;
    $(`#${id}`)?.removeAttribute('aria-invalid');
  }

  function fail(message, id) {
    const field = id ? $(`#${id}`) : null;
    const error = id ? $(`#${id}-error`) : $('#formErr');
    error.textContent = message;
    error.hidden = false;
    if (field instanceof HTMLInputElement) field.setAttribute('aria-invalid', 'true');
    if (id === 'arrival') field.open = true;
    const target = id === 'arrival' ? $('#arrival summary') : id === 'items' ? $('#items-heading') : field || error;
    target.focus({ preventScroll: true });
    target.scrollIntoView({ block: 'center' });
  }

  function checkForm(pc) {
    keep();
    ['items', 'arrival', 'f-name', 'f-phone', 'f-addr'].forEach(clearError);
    $('#formErr').hidden = true;
    const { name, phone, address } = form.contact;
    form.contact = { name: name.trim(), phone: phone.trim(), address: address.trim() };
    if (!pc.valid) fail(pc.lines.find((line) => line.error)?.error || '請檢查購物車商品', 'items');
    else if (!dates.ok(form.date)) fail(`請選擇${S.dateLabel || '希望到貨日期'}`, 'arrival');
    else if (!form.contact.name) fail('請填收件人姓名', 'f-name');
    else if (!/^[0-9+\-() ]{8,20}$/.test(form.contact.phone)) fail('請填正確的手機號碼', 'f-phone');
    else if (!form.contact.address) fail('請填收件地址', 'f-addr');
    else if (pays.length && !form.payment) fail('請選擇付款方式');
    else return true;
    return false;
  }

  // while online payment isn't open yet: send the whole order as a LINE message to the shop
  function chatOrder(pc, fee, total) {
    if (!checkForm(pc)) return;
    persist();
    const text = ['您好，我想訂購：', ...pc.lines.map((l) => `・${l.name} ×${l.qty}${l.it.type === 'canele-assorted' || l.temp === 'cookie' ? `（${l.detail}）` : ''}　${money(l.subtotal)}`),
      `運費 ${fee ? money(fee) : '免運'}／合計 ${money(total)}`, `${S.dateLabel || '日期'}：${NTC.fmtDate(form.date)}`,
      `收件人：${form.contact.name} ${form.contact.phone}`, `地址：${form.contact.address}`, form.note ? `備註：${form.note}` : ''].filter(Boolean).join('\n');
    if (NTC.inLine() && window.liff.sendMessages) {
      window.liff.sendMessages([{ type: 'text', text }]).then(() => { NTC.toast('已傳到聊天室，我們會盡快回覆您 ♡', 3500); setTimeout(() => window.liff.closeWindow(), 1500); })
        .catch(() => { location.href = NTC.chatUrl(text); });
      return;
    }
    location.href = NTC.chatUrl(text);
  }
  async function submit(pc) {
    if (!checkForm(pc)) return;
    sending = true;
    $('#submit').disabled = true;
    persist();
    NTC.loading(true, '送出訂單中…');
    try {
      const r = await NTC.api('/orders', { method: 'POST', body: {
        items: NTC.cart.items(), date: form.date, contact: form.contact, note: form.note,
        payment: form.payment, returnBase: location.href, inLine: false,
      } });
      // remember the order in this browser (guests find it again from 我的訂單)
      try { const list = JSON.parse(localStorage.getItem('ntc-orders') || '[]'); list.unshift({ no: r.orderNo, t: r.token, total: r.total, at: Date.now() }); localStorage.setItem('ntc-orders', JSON.stringify(list.slice(0, 30))); } catch (e) { /* ignore */ }
      NTC.cart.clear(); NTC.date.set('');
      if (NTC.inLine() && window.liff.sendMessages) { await window.liff.sendMessages([{ type: 'text', text: r.summary }]).catch(() => {}); }
      const n = r.next;
      if (n.type === 'redirect') { NTC.loading(true, '前往 LINE Pay…'); location.href = n.url; return; }
      if (n.type === 'form') {
        NTC.loading(true, '前往付款頁…');
        const f = document.createElement('form'); f.method = 'POST'; f.action = n.action;
        Object.entries(n.fields).forEach(([k, v]) => { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i); });
        document.body.appendChild(f); f.submit(); return;
      }
      location.href = n.url.replace(/^.*\/(order\.html.*)$/, '$1') + '&new=1';
    } catch (e) {
      sending = false;
      $('#submit').disabled = false;
      NTC.loading(false);
      fail(e.message);
    }
  }
  render();

})();
</script>
</body>
</html>
