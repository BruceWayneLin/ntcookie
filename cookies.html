<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<script>/* stale-page guard, part 1 (see js/app.js) */try{(function(d){var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(n&&n.transferSize>0)return;d.className+=' vchk';setTimeout(function(){d.classList.remove('vchk')},1200)})(document.documentElement)}catch(e){}</script>
<style>.vchk body{visibility:hidden}.vchk::before{content:"";position:fixed;left:50%;top:40%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:3px solid #ecd5c8;border-top-color:#b0604a;opacity:0;animation:vchk .8s linear infinite,vchkin .15s .12s forwards}@keyframes vchk{to{transform:rotate(360deg)}}@keyframes vchkin{to{opacity:1}}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>造型餅乾｜N.T Cookie × N.T Canelé</title>
<meta name="description" content="N.T Cookie 手作糖霜造型餅乾：可單片選購、自由搭配。生日・收涎・派對・送禮。">
<meta name="theme-color" content="#fbe8e0">
<meta property="og:title" content="造型餅乾｜N.T Cookie × N.T Canelé">
<meta property="og:image" content="https://brucewaynelin.github.io/ntcookie/assets/v2/03-homepage/category-character-cookies.png">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/cookies/ui/header.webp" type="image/webp">
<link rel="stylesheet" href="css/app.css?v=1121a">
<link rel="stylesheet" href="css/cookie-selection.css?v=1121c">
</head>
<body class="ckd-body">
<main class="ckd" id="page">
  <!-- design 0–247: the designer's header (bear cookie, canelés, flowers, 線上購物); series name, back and cart are live -->
  <header class="ckd-head">
    <button class="ckd-hot" id="back" aria-label="返回" style="left:0;top:0;width:max(calc(130*var(--u)),48px);height:max(calc(96*var(--u)),48px)"></button>
    <a class="ckd-cart" href="cart.html" aria-label="購物車"><svg viewBox="0 0 48 44"><path d="M3 5h7l6 24h22l5-17H13"/><circle cx="19" cy="37" r="3.3"/><circle cx="35" cy="37" r="3.3"/></svg><span class="badge" data-cart-count></span></a>
    <h1 class="ckd-pill" id="pill"></h1>
  </header>
  <div id="app"><div class="spinner"></div></div>
  <img class="ckd-corner l" src="assets/cookies/ui/corner-left.webp" alt="">
  <img class="ckd-corner r" src="assets/cookies/ui/corner-right.webp" alt="">
</main>
<div class="ckd-bar" id="bar" hidden></div>
<p class="sr-only" id="cookie-selection-status" role="status"></p>
<script src="js/config.js?v=1121c"></script>
<script src="js/app.js?v=1121a"></script>
<script src="js/shop.js?v=1121a"></script>
<script>
(function () {
  const { $, esc, money, asset } = NTC;
  const q = new URLSearchParams(location.search);
  // 分類是店主在後台自己建的（cookie.groups）；character、birthday 是首頁兩張大卡片連過來的
  const DEF_GROUPS = [{ id: 'character', name: '卡通・收涎' }, { id: 'birthday', name: '慶生・抓週' }];
  const groupsAll = () => (cat.settings.cookie?.groups?.length ? cat.settings.cookie.groups : DEF_GROUPS);
  const titleOf = (g) => (/餅乾$/.test(g.name) ? g.name : `${g.name}造型餅乾`);
  let gSel = q.get('g');
  const app = $('#app'); const bar = $('#bar');
  $('#back').onclick = NTC.back;
  let cat; let pick = {}; // productId -> qty chosen on this page (kept while switching series)
  let openSid = null; let groupPs = []; // accordion: the series that is open on the 卡通・收涎 / 慶生 page

  const setPill = (t) => { const p = $('#pill'); p.textContent = t; p.style.setProperty('--n', [...t].length); };
  const banner = (se, extra = '') => `
      ${se.photo ? `<div class="ph"><img src="${esc(asset(se.photo))}" alt=""></div>` : ''}
      <div class="tx"><h2 style="--n:${[...se.name].length}"><i class="sp l"></i>${esc(se.name)}<i class="sp r"></i></h2><div class="hr"><span>♡</span></div>${(se.lines || []).map((l) => `<p>${esc(l)}</p>`).join('')}${extra}</div>`;
  const backBtn = '<button type="button" class="ckd-back" id="back2"><i aria-hidden="true"></i>返回上一頁</button>';
  const minPieces = () => cat.settings.cookie.minPieces || 1;
  // 「一片就可以訂」的系列（例如巨型匾額）：購物車或這次選的裡面有它，就不用湊滿最少片數
  const singleIds = () => new Set((cat.settings.cookie.series || []).filter((x) => x.single).map((x) => x.id));
  const waived = (items, chosen = []) => { const ids = singleIds(); return items.some((i) => ids.has(cat.byId[i.productId]?.series)) || chosen.some((p) => ids.has(p.series)); };
  const cartCookiePieces = (items) => items.filter((item) => cat.byId[item.productId]?.category === 'cookie').reduce((total, item) => total + item.qty, 0);
  const minimumRule = () => `<p class="ckd-minimum-rule"><b>${minPieces()} 片起訂</b>，可跨系列搭配</p>`;
  const shippingNote = () => {
    const c = cat.settings.cookie; const t = [...c.shipping.tiers].sort((a, b) => a.upTo - b.upTo);
    const from = (i) => (i ? t[i - 1].upTo + 1 : minPieces());
    const ship = t.map((x, i) => (i === t.length - 1 && i > 0 ? `${from(i)} 片以上 ${money(x.fee)}` : from(i) >= x.upTo ? `${x.upTo} 片 ${money(x.fee)}` : `${from(i)}–${x.upTo} 片 ${money(x.fee)}`)).join('・');
    return `<p class="ckd-note">${esc(c.shipping.label)}：${ship}</p>`;
  };

  function render() {
    const series = cat.settings.cookie?.series || [];
    const se = q.get('s') && series.find((x) => x.id === q.get('s'));
    if (se) return renderSeries(se);
    const groups = groupsAll(); const inG = (x, id) => (x.groups || []).includes(id);
    const tabs = groups.filter((x) => series.some((y) => inG(y, x.id))); // categories that have something to show
    const gObj = groups.find((x) => x.id === gSel) || tabs[0] || groups[0];
    const g = gObj.id;
    const list = series.filter((x) => inG(x, g));
    if (list.length === 1 && tabs.length < 2) return renderSeries(list[0]);
    document.title = `${titleOf(gObj)}｜N.T Cookie × N.T Canelé`; setPill(titleOf(gObj));
    bar.hidden = true; document.body.classList.remove('ckd-has-bar');
    if (!list.length) {
      app.innerHTML = `${tabsHtml(tabs, g)}<section class="ckd-banner empty"><div class="tx"><h2 style="--n:9">線上選購準備中</h2><div class="hr"><span>♡</span></div>
          <p>卡通・收涎・慶生・抓週・婚禮小物</p><p>都可以客製，歡迎詢問報價</p></div></section>
        <a class="ckd-cta" href="custom.html${g === 'birthday' ? '?for=慶生' : ''}">客製詢問（留言＋上傳參考照片）</a>
        <a class="ckd-cta ghost" href="https://www.instagram.com/nt.cookie/">看作品集（Instagram）</a>${backBtn}`;
    } else {
      return renderGroup(list, g, tabs);
    }
    $('#back2').onclick = NTC.back; wireTabs();
  }
  // 分類分頁：首頁只有兩張造型餅乾大卡片，其他分類（例如中國風）從這裡切換
  const tabsHtml = (tabs, g) => (tabs.length < 2 ? '' : `<nav class="ckd-tabs" aria-label="造型餅乾分類">${tabs.map((x) => `<a href="cookies.html?g=${encodeURIComponent(x.id)}" data-g="${esc(x.id)}" class="${x.id === g ? 'on' : ''}"${x.id === g ? ' aria-current="page"' : ''}>${esc(x.name)}</a>`).join('')}</nav>`);
  function wireTabs() {
    app.querySelectorAll('.ckd-tabs a').forEach((a) => (a.onclick = (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault();
      if (a.dataset.g === gSel) return;
      gSel = a.dataset.g; openSid = null; history.replaceState(history.state, '', `cookies.html?g=${encodeURIComponent(gSel)}`);
      render(); window.scrollTo({ top: 0 });
    }));
    const on = app.querySelector('.ckd-tabs a.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  // 商品照片（後台可以放好幾張，可以左右滑）＋商品描述
  const infoHtml = (x) => {
    const ph = x.photos?.length > 1 ? x.photos : [];
    if (!ph.length && !x.desc) return '';
    return `<div class="ckd-info">${ph.length ? `<div class="ckd-gal" role="list">${ph.map((u, i) => `<button type="button" role="listitem" data-src="${esc(asset(u))}" aria-label="放大第 ${i + 1} 張照片"><img src="${esc(asset(u))}" alt="${esc(x.name)} 照片 ${i + 1}" loading="lazy"></button>`).join('')}</div>` : ''}${x.desc ? `<p class="ckd-desc">${esc(x.desc).replace(/\n/g, '<br>')}</p>` : ''}</div>`;
  };
  function showPhoto(src, label, trigger) {
    const view = document.createElement('div');
    view.className = 'ckd-view';
    view.setAttribute('role', 'dialog');
    view.setAttribute('aria-modal', 'true');
    view.setAttribute('aria-label', label);
    view.innerHTML = `<img src="${esc(src)}" alt="${esc(label)}"><button type="button" aria-label="關閉照片">✕</button><p>${esc(label)}</p>`;
    const oldOverflow = document.body.style.overflow;
    const close = () => { view.remove(); document.body.style.overflow = oldOverflow; document.removeEventListener('keydown', onKey); trigger?.focus(); };
    const onKey = (e) => {
      if (e.key === 'Escape') close();
      if (e.key === 'Tab') { e.preventDefault(); view.querySelector('button').focus(); }
    };
    view.onclick = (e) => { if (e.target === view || e.target.closest('button')) close(); };
    document.body.appendChild(view);
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', onKey);
    view.querySelector('button').focus();
  }
  function wireInfo(root) {
    root.querySelectorAll('.ckd-gal button').forEach((b) => (b.onclick = () => {
      showPhoto(b.dataset.src, b.querySelector('img')?.alt || '系列', b);
    }));
  }

  function gridHtml(ps) {
    return `<div class="ckd-grid">${ps.map((p) => {
      const photo = `${p.photo ? `<img src="${esc(asset(p.photo))}" alt="" loading="lazy">` : ''}${p.soldOut ? '<span class="sob">售完</span>' : ''}${p.active === false ? '<span class="offtag">未上架</span>' : ''}`;
      const photoControl = p.photo
        ? `<button type="button" class="ph" data-src="${esc(asset(p.photo))}" aria-label="放大${esc(p.name)}的照片">${photo}<span class="zoom-hint" aria-hidden="true">點圖放大</span></button>`
        : `<div class="ph">${photo}</div>`;
      return `<div class="ckd-card${p.soldOut ? ' so' : ''}" data-id="${esc(p.id)}">
        ${photoControl}<div class="nm">${esc(p.name)}</div><div class="pr">${money(p.price)}</div><div class="st"></div></div>`;
    }).join('') || '<p class="ckd-note">這個系列還沒有餅乾，敬請期待</p>'}</div>`;
  }
  function wireCards(root, ps, barPs) {
    root.querySelectorAll('.ckd-card').forEach((c) => {
      const p = ps.find((x) => x.id === c.dataset.id);
      const stepper = c.querySelector('.st');
      NTC.stepper(stepper, { value: pick[p.id] || 0, min: 0, max: p.soldOut ? 0 : 200, onChange: (v) => { pick[p.id] = v; c.classList.toggle('on', v > 0); paintBar(barPs); } });
      const [minus, plus] = stepper.querySelectorAll('button');
      minus.setAttribute('aria-label', `減少${p.name}的數量`);
      plus.setAttribute('aria-label', `增加${p.name}的數量`);
      stepper.querySelector('output').setAttribute('aria-live', 'off');
      c.classList.toggle('on', (pick[p.id] || 0) > 0);
      const photo = c.querySelector('button.ph');
      if (photo) photo.onclick = () => showPhoto(photo.dataset.src, p.name, photo);
    });
  }

  // 卡通・收涎 / 慶生: every series is a bar; tap one to open its cookies right below (only one open at a time)
  function renderGroup(list, g, tabs = []) {
    groupPs = cat.products.filter((p) => list.some((x) => x.id === p.series));
    app.innerHTML = `${tabsHtml(tabs, g)}${minimumRule()}<div class="ckd-acc-list">${list.map((x) => {
      const ps = cat.products.filter((p) => p.series === x.id); const lo = ps.length ? Math.min(...ps.map((p) => p.price)) : 0;
      return `<section class="ckd-acc" data-sid="${esc(x.id)}">
        <button type="button" class="ckd-acc-head" aria-expanded="false">
          ${x.photo ? `<span class="ph"><img src="${esc(asset(x.photo))}" alt=""></span>` : ''}
          <span class="t"><b style="--n:${[...x.name].length}">${esc(x.name)}</b><small>${ps.length} 款・單片 ${money(lo)} 起${x.single ? '・1 片可訂' : ''}${x.active ? '' : '・<em>未上架</em>'}</small></span>
          <span class="cnt" hidden></span><span class="chev" aria-hidden="true"></span></button>
        <div class="ckd-acc-body" hidden></div></section>`;
    }).join('')}</div>${shippingNote()}<a class="ckd-custom" href="custom.html${g === 'birthday' ? '?for=慶生' : ''}">想要其他圖案？<b>客製詢問 ›</b></a>${backBtn}`;
    $('#back2').onclick = NTC.back; wireTabs();
    const open = (sid, scroll) => {
      app.querySelectorAll('.ckd-acc').forEach((sec) => {
        const on = sec.dataset.sid === sid; const body = sec.querySelector('.ckd-acc-body');
        sec.classList.toggle('open', on); sec.querySelector('.ckd-acc-head').setAttribute('aria-expanded', on); body.hidden = !on;
        if (on && !body.childElementCount) { const ps = cat.products.filter((p) => p.series === sid); body.innerHTML = infoHtml(list.find((x) => x.id === sid) || {}) + gridHtml(ps); wireInfo(body); wireCards(body, ps, groupPs); }
        if (!on) body.innerHTML = '';
      });
      openSid = sid;
      if (sid && scroll) setTimeout(() => app.querySelector(`.ckd-acc[data-sid="${CSS.escape(sid)}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30);
    };
    app.querySelectorAll('.ckd-acc-head').forEach((h) => (h.onclick = () => { const sid = h.closest('.ckd-acc').dataset.sid; open(openSid === sid ? null : sid, openSid !== sid); }));
    if (openSid && list.some((x) => x.id === openSid)) open(openSid, false);
    else if (list.length === 1) open(list[0].id, false); // a category with a single product: open it right away
    document.body.classList.add('ckd-has-bar');
    paintBar(groupPs);
  }

  function renderSeries(se) {
    document.title = `${se.name}｜N.T Cookie × N.T Canelé`; setPill(se.name);
    const ps = cat.products.filter((p) => p.series === se.id);
    const off = ps.filter((p) => p.active === false).length;
    app.innerHTML = `${!se.active ? '<div class="ckd-adm">預覽：這個系列還沒有上架的餅乾，客人看不到這一頁。到後台把餅乾「上架」，客人就看得到。</div>'
      : off ? `<div class="ckd-adm">預覽：有 ${off} 款還沒上架（標「未上架」），客人看不到那幾款。</div>` : ''}
      <section class="ckd-banner">${banner(se)}</section>${infoHtml(se)}
      <img class="ckd-sec" src="assets/cookies/ui/section.webp" alt="單片選購">
      ${se.single ? '<p class="ckd-minimum-rule"><b>這個系列 1 片就可以訂</b></p>' : minimumRule()}${gridHtml(ps)}
      ${shippingNote()}<a class="ckd-custom" href="custom.html">系列裡沒有想要的圖案？<b>客製詢問 ›</b></a>${backBtn}`;
    $('#back2').onclick = NTC.back; wireInfo(app);
    wireCards(app, ps, ps);
    document.body.classList.add('ckd-has-bar');
    paintBar(ps);
  }

  function paintBar(ps) {
    const chosen = ps.filter((p) => (pick[p.id] || 0) > 0);
    app.querySelectorAll('.ckd-acc').forEach((sec) => { const k = cat.products.filter((p) => p.series === sec.dataset.sid).reduce((a, p) => a + (pick[p.id] || 0), 0); const c = sec.querySelector('.cnt'); c.hidden = !k; c.textContent = k ? `已選 ${k}` : ''; });
    const n = chosen.reduce((a, p) => a + pick[p.id], 0); const sum = chosen.reduce((a, p) => a + pick[p.id] * p.price, 0);
    const items = NTC.cart.items(); const inCart = items.reduce((a, i) => a + i.qty, 0);
    const cartPieces = cartCookiePieces(items);
    const min = waived(items, chosen) ? 1 : minPieces();
    const left = min - cartPieces - n;
    const cartNote = cartPieces ? `購物車已有 ${cartPieces} 片・` : '';
    const reached = cartPieces >= min ? `已達 ${min} 片起訂` : `加入後達 ${min} 片起訂`;
    const minimumText = n
      ? cartNote + (left > 0 ? `距 ${min} 片起訂還差 ${left} 片` : reached)
      : cartPieces && left > 0 ? `${cartNote}還差 ${left} 片達起訂量` : '';
    const minimumHint = minimumText ? `<p class="ckd-minimum-hint" id="cookie-minimum">${minimumText}</p>` : '';
    const selectionStatus = $('#cookie-selection-status');
    const announcement = n ? `本次已選 ${n} 片。${minimumText}` : '';
    if (selectionStatus.textContent !== announcement) selectionStatus.textContent = announcement;
    const cartSum = inCart ? NTC.priceCart(items, cat).subtotal : 0;
    const CART = '<svg viewBox="0 0 48 44"><path d="M3 5h7l6 24h22l5-17H13"/><circle cx="19" cy="37" r="3.3"/><circle cx="35" cy="37" r="3.3"/></svg>';
    const listPage = !!app.querySelector('.ckd-acc');
    if (!n && !inCart && listPage) { bar.hidden = true; document.body.classList.remove('ckd-has-bar'); return; } // series list with nothing picked: no floating button over the text
    bar.hidden = false; document.body.classList.add('ckd-has-bar');
    if (n) { // picked something on this page → add it
      bar.innerHTML = `<div class="ckd-chip"><span data-cookie-selection>本次已選 <b>${n}</b> 片・${money(sum)}</span>${inCart ? `<a href="cart.html">購物車 ${inCart} 件 ›</a>` : ''}</div>
        ${minimumHint}
        <button type="button" class="ckd-add" id="add" aria-label="加入購物車"><img src="assets/cookies/ui/add.webp" alt="加入購物車"></button>`;
      $('#add').onclick = () => add(chosen);
    } else if (inCart) { // nothing picked, cart has items → a real button to the cart
      bar.innerHTML = `${minimumHint}<a class="ckd-go" href="cart.html">${CART}<span>前往購物車結帳</span><small>${inCart} 件・${money(cartSum)}</small></a>`;
    } else {
      bar.innerHTML = `<button type="button" class="ckd-add off" id="add" aria-label="加入購物車"><img src="assets/cookies/ui/add.webp" alt="加入購物車"></button>`;
      $('#add').onclick = () => NTC.toast('請先點 ＋ 選擇想要的餅乾');
    }
  }

  function add(chosen) {
    const needText = chosen.filter((p) => p.textLabel);
    const done = (texts = {}) => {
      chosen.forEach((p) => NTC.cart.add({ type: 'product', productId: p.id, qty: pick[p.id], ...(texts[p.id] ? { text: texts[p.id] } : {}) }));
      const n = chosen.reduce((a, p) => a + pick[p.id], 0);
      pick = {}; render();
      const ck = cartCookiePieces(NTC.cart.items()); const min = waived(NTC.cart.items()) ? 1 : minPieces();
      NTC.toast(ck < min ? `已加入 ${n} 片，再選 ${min - ck} 片就能結帳（${min} 片起訂）` : `已加入 ${n} 片到購物車 ♡`, 3200);
    };
    if (!needText.length) return done();
    // 名字 and 日期 are asked separately; the date comes from a calendar and is written in 民國 style like the shop's cookies (115.03.23)
    const has = (p, w) => (p.textLabel || '').includes(w);
    const nameLabelRaw = (p) => p.textLabel.replace(/[＋+]\s*日期|日期\s*[＋+]|^日期$/, '').trim();
    const nameLabel = (p) => nameLabelRaw(p) || '名字';
    const kind = (p) => (has(p, '日期') ? (nameLabelRaw(p) ? 'nd' : 'd') : 'n'); // any label + 日期 → name field and calendar
    const roc = (ymd) => { const [y, m, d] = ymd.split('-').map(Number); return `${y - 1911}.${String(m).padStart(2, '0')}.${String(d).padStart(2, '0')}`; };
    const opt = (p) => (p.textOptional ? '（選填，不填就照圖上的字）' : '（必填）');
    const field = (p, index) => {
      const k = kind(p); const head = `<p class="tf-head">${esc(p.name)} × ${pick[p.id]}${opt(p)}</p>`;
      const nameMax = k === 'nd' ? Math.max(2, (p.textMax || 16) - 10) : (p.textMax || 12);
      const required = p.textOptional ? '' : 'required';
      const label = esc(k === 'n' ? p.textLabel : nameLabel(p));
      const nameId = `cookie-name-${index}`; const dateId = `cookie-date-${index}`;
      const nameIn = `<div class="field">
        <label class="tf-label" for="${nameId}">${label}（最多 ${nameMax} 字）</label>
        <input id="${nameId}" data-part="name" maxlength="${nameMax}" placeholder="${has(p, '名字') ? '例：林羽澄' : '例：4 months'}" autocomplete="off" ${required}>
        <small class="tf-error" id="${nameId}-error" hidden>請填寫${label}</small>
        </div>`;
      const dateIn = `<div class="field">
        <label class="tf-label" for="${dateId}">日期（點一下用日曆選）</label>
        <input id="${dateId}" type="date" data-part="date" aria-describedby="${dateId}-hint" ${required}>
        <small class="tf-hint" id="${dateId}-hint">餅乾上會寫成民國日期，例如 115.03.23</small>
        <small class="tf-error" id="${dateId}-error" hidden>請用日曆選日期</small>
        </div>`;
      return `<div class="tf" data-id="${esc(p.id)}">${head}${k !== 'd' ? nameIn : ''}${k !== 'n' ? dateIn : ''}</div>`;
    };
    const allNames = needText.every((p) => has(p, '名字'));
    const { el, close } = NTC.sheet(`<h2 id="cookie-personalization-title">${allNames ? (needText.some((p) => has(p, '日期')) ? '填寫寶寶名字與日期' : '填寫寶寶名字') : '填寫餅乾上的字'}</h2>
      <p class="sub">我們會照您填的內容手繪在餅乾上。每片要不同的字，請分次加入購物車。</p>
      <form class="cookie-personalization" novalidate>
        ${needText.map(field).join('')}
        <button type="submit" class="btn block" id="ok">加入購物車</button>
      </form>`);
    el.setAttribute('aria-labelledby', 'cookie-personalization-title');
    const form = el.querySelector('form');
    const setError = (input, invalid) => {
      const error = input.parentElement.querySelector('.tf-error');
      const hint = input.parentElement.querySelector('.tf-hint');
      const descriptions = [hint?.id, invalid ? error.id : ''].filter(Boolean).join(' ');
      if (invalid) input.setAttribute('aria-invalid', 'true');
      else input.removeAttribute('aria-invalid');
      if (descriptions) input.setAttribute('aria-describedby', descriptions);
      else input.removeAttribute('aria-describedby');
      error.hidden = !invalid;
    };
    form.addEventListener('input', ({ target }) => {
      if (target.dataset.part === 'date') {
        target.parentElement.querySelector('.tf-hint').textContent = target.value
          ? `餅乾上會寫成：${roc(target.value)}` : '餅乾上會寫成民國日期，例如 115.03.23';
      }
      if (target.matches('input[aria-invalid]') && target.value.trim()) setError(target, false);
    });
    form.querySelector('input').focus();
    form.onsubmit = (event) => {
      event.preventDefault();
      const texts = {};
      let firstInvalid = null;
      for (const box of form.querySelectorAll('.tf')) {
        const parts = [];
        for (const input of box.querySelectorAll('input')) {
          const value = input.value.trim().replace(/\s+/g, ' ');
          const invalid = input.required && !value;
          setError(input, invalid);
          if (invalid) firstInvalid ||= input;
          if (value) parts.push(input.type === 'date' ? roc(value) : value);
        }
        if (parts.length) texts[box.dataset.id] = parts.join(' ');
      }
      if (firstInvalid) { firstInvalid.focus(); return; }
      close(); done(texts);
    };
  }

  document.addEventListener('ntc:cart', () => { if (!cat || bar.hidden) return; paintBar(app.querySelector('.ckd-acc') ? groupPs : cat.products.filter((p) => app.querySelector(`.ckd-card[data-id="${CSS.escape(p.id)}"]`))); });
  NTC.refreshCart();
  NTC.catalog().then((c) => {
    cat = c;
    // admins get hidden series from the server too; show them only in preview (the admin's 「看這一頁」 link adds ?preview=1),
    // so by default an admin sees exactly what customers see
    if (q.get('preview') !== '1' && cat.settings.cookie) {
      const on = (cat.settings.cookie.series || []).filter((x) => x.active); const ids = new Set(on.map((x) => x.id));
      cat.settings.cookie = { ...cat.settings.cookie, series: on };
      cat.products = cat.products.filter((p) => p.category !== 'cookie' || (ids.has(p.series) && p.active !== false)); cat.byId = Object.fromEntries(cat.products.map((p) => [p.id, p]));
    }
    render();
  }).catch((e) => { app.innerHTML = `<p class="ckd-note">${esc(e.message)}</p>`; });
})();
</script>
</body>
</html>
