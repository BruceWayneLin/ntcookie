<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<script>/* stale-page guard, part 1 (see js/app.js) */try{(function(d){var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(n&&n.transferSize>0)return;d.className+=' vchk';setTimeout(function(){d.classList.remove('vchk')},2500)})(document.documentElement)}catch(e){}</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>店家後台｜N.T Cookie × N.T Canelé</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root { --page: 760px; }
  .tabs { position: sticky; top: 63px; z-index: 20; display: flex; gap: 6px; max-width: var(--page); margin: 0 auto; padding: 8px 14px; background: rgba(248, 237, 231, .96); }
  .tabs button { flex: 1; border: 0; border-radius: 12px; padding: 10px 0; background: #fff; font: 800 15px var(--serif); letter-spacing: .1em; color: var(--ink2); cursor: pointer; }
  .tabs button.on { background: var(--brown); color: #fff; }
  .ord { display: block; width: 100%; text-align: left; border: 1px solid #f1e2d9; background: var(--card); border-radius: 16px; padding: 12px 14px; margin: 0 0 10px; cursor: pointer; }
  .ord .top { display: flex; align-items: center; gap: 8px; }
  .ord .top b { font: 900 16px var(--serif); letter-spacing: .03em; }
  .ord .mid { font-size: 13.5px; color: var(--ink2); margin-top: 6px; line-height: 1.5; }
  .ord .amt { font-weight: 800; color: var(--brown); }
  .flag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #fdecd3; color: #9a5b0b; margin-left: 4px; }
  .flag.ok { background: #e3f1e6; color: #2f6b3d; }
  .prod { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dashed #ead7cc; }
  .prod:last-child { border-bottom: 0; }
  .prod img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex: none; background: #f3e4db; }
  .prod .i { flex: 1; min-width: 0; }
  .prod .i b { display: block; font-size: 15px; }
  .prod .i span { font-size: 13px; color: var(--ink2); }
  .tg { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink2); cursor: pointer; user-select: none; }
  .tg input { appearance: none; width: 40px; height: 24px; border-radius: 999px; background: #dccbc1; position: relative; cursor: pointer; transition: background .2s; margin: 0; }
  .tg input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
  .tg input:checked { background: #3f7d4e; }
  .tg input:checked::after { left: 19px; }
  .tg.red input:checked { background: var(--red); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .hist { font-size: 12.5px; color: var(--ink2); line-height: 1.6; max-height: 140px; overflow: auto; background: #fbf3ee; border-radius: 10px; padding: 8px 10px; }
  .statusbar { display: flex; flex-wrap: wrap; gap: 6px; }
  .statusbar button { border: 1.5px solid #e3cdbf; background: #fff; border-radius: 999px; padding: 7px 12px; font: 700 13.5px var(--sans); cursor: pointer; }
  .statusbar button.on { background: var(--brown); border-color: var(--brown); color: #fff; }
  .tag-del { border: 0; background: #f1e1d8; border-radius: 999px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .shopbar { max-width: var(--page); margin: 0 auto; padding: 4px 14px 0; }
  .shopbar .box { display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 12px 14px; background: #fff; border: 1.5px solid #ead7cc; }
  .shopbar .box.on { background: #eef8f0; border-color: #a9d3b3; }
  .shopbar .box.off { background: #fdf0ef; border-color: #ecc3c0; }
  .shopbar .dot2 { width: 14px; height: 14px; border-radius: 50%; flex: none; background: #c0504d; box-shadow: 0 0 0 4px rgba(192, 80, 77, .18); }
  .shopbar .on .dot2 { background: #3f7d4e; box-shadow: 0 0 0 4px rgba(63, 125, 78, .18); }
  .shopbar .t { flex: 1; font-size: 13px; color: var(--ink2); line-height: 1.45; }
  .shopbar .t b { display: block; font: 900 17px var(--serif); color: var(--ink); letter-spacing: .06em; }
  code { background: #f6e8e0; padding: 2px 6px; border-radius: 6px; font-size: 12.5px; word-break: break-all; }
  /* --- admin tidy-up (11-19): badges, one-row filters, action highlight, product categories, folding settings */
  .tabs button { position: relative; }
  .tabs .tb { position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #c2362f; color: #fff; font: 800 12px/20px var(--sans); text-align: center; box-shadow: 0 0 0 2px var(--bg); }
  .statusbar.one { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; margin-right: -14px; padding-right: 14px; scrollbar-width: none; }
  .statusbar.one::-webkit-scrollbar { display: none; }
  .statusbar.one button { flex: none; white-space: nowrap; }
  .ord.needs { box-shadow: inset 5px 0 0 #d9822b, 0 2px 10px rgba(150, 95, 70, .08); }
  .ord .todo { display: block; margin-top: 6px; padding: 6px 10px; border-radius: 10px; background: #fff3e0; color: #9a4f08; font: 700 13px/1.4 var(--sans); }
  .testlink { display: block; margin: 6px 2px 0; text-align: right; font: 600 13px/1.4 var(--sans); color: var(--muted); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 12px; }
  .seg button { padding: 10px 4px; border: 1.5px solid #e3cdbf; border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; font: 800 14px/1.25 var(--sans); }
  .seg button small { display: block; margin-top: 3px; font: 600 11.5px/1.2 var(--sans); color: var(--muted); }
  .seg button.on { background: var(--brown); border-color: var(--brown); color: #fff; }
  .seg button.on small { color: #f3dccf; }
  .sr-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; }
  .sr-head img { width: 64px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; background: #f3e4db; }
  .sr-head .i { flex: 1; min-width: 0; }
  .sr-head .i b { display: block; font: 900 16px/1.3 var(--serif); }
  .sr-head .i span { display: block; margin-top: 3px; font: 600 12.5px/1.3 var(--sans); color: var(--muted); }
  .sr-head .i span.live { color: var(--ok); }
  .sr-head .chev, .acc-h .chev { flex: none; width: 9px; height: 9px; border: solid var(--brown); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); margin: -4px 6px 0 0; transition: transform .2s; }
  .sr.open .sr-head .chev, .acc.open .acc-h .chev { transform: rotate(-135deg); margin-top: 4px; }
  .sr-tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 6px; padding-top: 12px; border-top: 1px dashed #ead7cc; }
  .acc-h { display: flex; align-items: center; gap: 10px; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; }
  .acc-h b { font: 900 17px/1.3 var(--serif); }
  .acc-h small { flex: 1; min-width: 0; font: 500 12.5px/1.35 var(--sans); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .acc.open .acc-h { margin-bottom: 12px; }
  .acc.open .acc-h small { visibility: hidden; }
  .sn { padding: 10px 0 12px; border-top: 1px dashed var(--line, #ead9cf); } .sn:first-child { border-top: 0; padding-top: 0; }
  .sn .sn-auto { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: #fbf3ee; line-height: 1.6; } .sn .field { margin-bottom: 6px; } .sn textarea { min-height: 58px; } .sn.sn-x { border-top-style: solid; }
  .savebar { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 45; width: min(100vw, var(--page)); display: flex; align-items: center; gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: #fff8f0; border-top: 1px solid #e7cdb6; box-shadow: 0 -4px 14px rgba(120, 70, 40, .14); }
  .savebar span { flex: 1; font: 700 14px/1.3 var(--sans); color: #9a4f08; }
</style>
</head>
<body>
<header class="topbar">
  <a class="circle-btn" href="index.html" aria-label="回首頁"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></a>
  <h1>店家後台</h1>
  <button class="circle-btn" id="reload" aria-label="重新整理"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
</header>
<nav class="tabs" id="tabs" hidden><button data-t="orders" class="on">訂單</button><button data-t="inq">客製</button><button data-t="products">商品</button><button data-t="settings">設定</button></nav>
<div class="shopbar" id="shopbar" hidden></div>
<main class="wrap" id="app"><div class="spinner"></div></main>
<p class="note" id="ver" style="text-align:center;margin:0 0 24px;color:var(--muted)"></p>
<script src="js/config.js?v=1120h"></script>
<script src="js/app.js?v=1120h"></script>
<script>
(async function () {
  const { $, esc, money, asset } = NTC;
  const app = $('#app');
  $('#ver').textContent = '版本 ' + (NTC_CONFIG.version || '');
  const q = new URLSearchParams(location.search);
  const PAY = { linepay: 'LINE Pay', ecpay: '綠界', transfer: '轉帳' };
  let canDeleteReal = false; // only the fixed top admin may delete customer orders
  let tab = 'orders'; let statuses = {}; let orders = []; let filter = 'open'; let sortBy = 'created';
  let products = []; let settings = null; let ready = {}; let inqs = null; let inqStatuses = {}; let inqFilter = 'open'; let inqP = null; let dirty = false; let prodCat = 'canele'; const openAcc = new Set();
  const NOTE_TOPICS = [['date', '到貨日'], ['cookie', '造型餅乾'], ['canele', '可麗露'], ['meringue', '馬林糖一口酥'], ['pay', '付款'], ['custom', '客製造型']]; // 購物須知：自動寫好的六則（同 js/app.js NTC.shopNotes）

  // ---------- who are you?  The LINE account decides: admins go straight in, everyone else is stopped here.
  NTC.preferAdmin = true;
  const card = (inner) => { $('#tabs').hidden = true; $('#shopbar').hidden = true; app.innerHTML = `<div class="panel" style="max-width:440px;margin:24px auto;text-align:center">${inner}</div>`; };
  const loginScreen = (msg) => { // outside LINE (e.g. a computer): log in with LINE (QR code / LINE app)
    card(`<p style="font:900 20px var(--serif);margin:6px 0 4px">店家後台</p><p class="note" style="margin:0 0 14px">請用店家管理員的 LINE 帳號登入</p>
      <button class="btn line block" id="login">用 LINE 登入</button>${msg ? `<p class="err">${esc(msg)}</p>` : ''}`);
    $('#login').onclick = NTC.login;
  };
  const notAdminScreen = async (me) => { // a LINE member who isn't an admin: nothing of the shop is shown
    NTC.markAdmin(false);
    card(`${me.picture ? `<img src="${esc(me.picture)}" alt="" style="width:64px;height:64px;border-radius:50%;margin:4px auto 8px">` : ''}
      <p style="font:900 19px var(--serif);margin:0 0 6px">「${esc(me.name)}」不是管理員</p>
      <p class="note" style="margin:0 0 14px">這裡是店家後台，只有管理員的 LINE 帳號可以進入。</p>
      <form id="phoneform" style="text-align:left"><label class="field"><span>如果管理員已經幫你新增手機，輸入那個號碼就會成為管理員（只需要一次）</span>
        <input id="bindphone" type="tel" inputmode="tel" autocomplete="tel" placeholder="09xx-xxx-xxx" maxlength="20" style="text-align:center;font-size:18px"></label>
        <p class="err" id="phoneerr" hidden></p><button class="btn block">綁定並進入後台</button></form>
      <button class="btn ghost block small" id="askadmin" style="margin-top:14px">沒有手機號碼？申請成為管理員</button><p class="note" id="askmsg" style="margin:10px 0 0" hidden></p>
      ${NTC.inLineApp() ? '' : '<button class="btn ghost block small" id="switchacc" style="margin-top:10px">換一個 LINE 帳號</button>'}
      <a class="btn ghost block small" href="index.html" style="margin-top:10px">回官網</a>`);
    $('#phoneform').onsubmit = async (e) => {
      e.preventDefault(); const phone = $('#bindphone').value.trim(); if (!phone) return;
      NTC.loading(true, '綁定中…');
      try { await NTC.api('/admin/bind-phone', { method: 'POST', body: { phone }, asLine: true }); location.replace(location.pathname); }
      catch (err) { NTC.loading(false); $('#phoneerr').textContent = err.message; $('#phoneerr').hidden = false; }
    };
    $('#askadmin').onclick = async () => {
      NTC.loading(true, '送出申請…');
      try { const r = await NTC.api('/admin/request', { method: 'POST', body: {}, asLine: true }); if (r.admin) { location.reload(); return; }
        $('#askadmin').disabled = true; $('#askmsg').hidden = false; $('#askmsg').textContent = '已送出申請，請現有的管理員在「設定 → 管理員」核准，核准後重新打開這一頁就能進來。'; }
      catch (e) { NTC.toast(e.message, 3500); } finally { NTC.loading(false); }
    };
    if ($('#switchacc')) $('#switchacc').onclick = async () => { await NTC.logout(); location.reload(); };
  };
  const invite = q.get('invite');
  if (!NTC.isDev() && (invite || !NTC.adminToken())) { // an invite always needs the LINE account, even on a device logged in with the passcode
    const l = await NTC.liff();
    if (l && !(await NTC.loggedIn())) {
      let tried = false; try { tried = sessionStorage.getItem('ntc-auto-login') === '1'; } catch (e) { /* ignore */ }
      if (NTC.inLineApp() && !tried) { // inside LINE: log in silently with the LINE account
        try { sessionStorage.setItem('ntc-auto-login', '1'); } catch (e) { /* ignore */ }
        NTC.loading(true, '用 LINE 確認身分中…'); l.login({ redirectUri: location.href.split('#')[0] }); return;
      }
      if (invite) { card(`<p style="font:900 20px var(--serif);margin:6px 0 4px">管理員邀請</p><p class="note" style="margin:0 0 14px">用你的 LINE 帳號登入，這個帳號就會成為店家管理員。</p><button class="btn line block" id="login">用 LINE 登入並接受邀請</button>`); $('#login').onclick = NTC.login; return; }
      loginScreen(); return;
    }
    if (!l) { loginScreen('LINE 登入暫時無法使用，請稍後再試'); return; }
  }
  if (invite) {
    try { await NTC.api('/admin/claim', { method: 'POST', body: { invite }, asLine: true }); const me = await NTC.lineProfile().catch(() => null); NTC.toast(`已把 LINE「${me ? me.name : ''}」加成管理員`, 3500); }
    catch (e) { NTC.toast(e.message, 4500); }
    history.replaceState(null, '', location.pathname);
  }
  try { await loadOrders(); NTC.markAdmin(true); }
  catch (e) {
    const me = (e.status === 403 || e.status === 401) && (await NTC.lineProfile().catch(() => null));
    if (me && e.status === 403) { await notAdminScreen(me); return; }
    if (e.status === 401 && NTC.adminToken()) NTC.setAdminToken('');
    loginScreen(e.status === 401 || e.status === 403 ? e.message : e.message + '（請再試一次）'); return;
  }
  $('#tabs').hidden = false;
  const deepInq = (q.get('inq') || '').toUpperCase();
  if (deepInq) {
    history.replaceState(null, '', location.pathname);
    setTimeout(async () => { tab = 'inq'; $('#tabs').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.t === 'inq')); await show(); const x = inqs.find((y) => y.no === deepInq); if (x) openInq(x); else NTC.toast(`找不到客製詢問 ${deepInq}`); }, 0);
  }
  const deep = (q.get('order') || '').toUpperCase();
  if (deep) {
    history.replaceState(null, '', location.pathname);
    setTimeout(() => { const o = orders.find((x) => x.orderNo === deep); if (o) openOrder(o); else NTC.toast(`找不到訂單 ${deep}`); }, 0);
  }
  try { await loadSettings(); renderShopBar(); } catch (e) { /* settings tab will retry */ }
  loadInqs().then(paintTabs).catch(() => {}); // so the 客製 tab can show how many new requests are waiting
  // logged in with the passcode inside LINE, but this LINE account isn't an admin yet → offer to bind it (one tap, then no passcode needed in LINE)
  (async () => {
    const me = NTC.adminToken() && !NTC.isDev() && (await NTC.lineProfile().catch(() => null));
    if (!me || !settings || (settings.admins || []).some((a) => a.sub === me.sub)) return;
    $('#shopbar').insertAdjacentHTML('beforeend', `<div class="box" id="bindbox" style="margin-top:8px;background:#eef8f0;border-color:#a9d3b3"><span class="t"><b style="font-size:15px">綁定這個 LINE 帳號</b>綁定「${esc(me.name)}」後，之後在 LINE 打開後台會自動認得你，不用再輸入密碼。</span><button class="btn small line" id="bindline">綁定</button></div>`);
    $('#bindline').onclick = async () => {
      NTC.loading(true, '綁定中…');
      try { await NTC.api('/admin/bind-line', { method: 'POST', body: { adminToken: NTC.adminToken() }, asLine: true }); await loadSettings(); $('#bindbox').remove(); NTC.toast(`已綁定 ${me.name}`); }
      catch (e) { NTC.toast(e.message, 3500); } finally { NTC.loading(false); }
    };
  })();
  $('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (!b || b.dataset.t === tab) return;
    if (dirty && !confirm('設定有變更還沒儲存，要離開嗎？（離開後變更不會保留）')) return;
    setDirty(false); tab = b.dataset.t; $('#tabs').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); show(); };
  $('#reload').onclick = async () => { NTC.loading(true, '更新中…'); try { if (tab === 'orders') await loadOrders(); if (tab === 'inq') await loadInqs(); if (tab === 'products') products = (await NTC.api('/admin/products')).products; if (tab === 'settings') await loadSettings(); show(); } catch (e) { NTC.toast(e.message); } NTC.loading(false); };

  // ---------- 開店接單／關閉接單 (one big switch at the top)
  function renderShopBar() {
    const bar = $('#shopbar'); if (!settings) return;
    const open = !settings.pauseOrders;
    const pays = [settings.payments.transfer && settings.bank.account ? '銀行轉帳' : '', settings.payments.ecpay && ready.ecpay ? '信用卡／ATM／超商' : '', settings.payments.linepay && ready.linepay ? 'LINE Pay' : ''].filter(Boolean).join('、');
    const how = !open ? '客人可以逛，但不能下單（休息、檔期滿都用這個）'
      : settings.testMode ? '客人結帳會「用 LINE 傳訂單給店家」（測試模式開著）' : `客人可以下單，付款方式：${pays || '（還沒開任何付款方式）'}`;
    bar.hidden = !(tab === 'orders' || tab === 'settings'); // the switch belongs with the orders and the settings, not with 客製 / 商品
    bar.innerHTML = `<div class="box ${open ? 'on' : 'off'}"><span class="dot2"></span><span class="t"><b>${open ? '接單中' : '關閉接單中'}</b>${how}</span>
      <button class="btn small ${open ? 'ghost' : ''}" id="toggleShop">${open ? '關閉接單' : '開店接單'}</button></div>
      ${tab === 'orders' ? '<a class="testlink" href="shop.html">🔧 自己下一張測試單 ›</a>' : ''}`;
    $('#toggleShop').onclick = async () => {
      const next = !open;
      if (!confirm(next ? '確定開店接單？客人馬上就能下單。' : '確定關閉接單？客人會看到「目前暫停接單」，已經下的訂單不受影響。')) return;
      NTC.loading(true, '更新中…');
      try { settings = (await NTC.api('/admin/settings', { method: 'PUT', body: { pauseOrders: !next } })).settings; renderShopBar(); if (tab === 'settings') renderSettings(); NTC.toast(next ? '已開店接單' : '已關閉接單'); }
      catch (e) { NTC.toast(e.message, 3500); } finally { NTC.loading(false); }
    };
  }

  async function loadOrders() { const r = await NTC.api('/admin/orders'); orders = r.orders; statuses = r.statuses; canDeleteReal = !!r.canDeleteReal; }
  async function loadSettings() { const r = await NTC.api('/admin/settings'); settings = r.settings; ready = r.ready; }
  // red number on a tab = things waiting for the shop: transfers to confirm (訂單), new requests (客製)
  function paintTabs() {
    const n = { orders: orders.filter((o) => o.status === 'reported').length, inq: (inqs || []).filter((x) => x.status === 'new').length };
    $('#tabs').querySelectorAll('button').forEach((b) => { const old = b.querySelector('.tb'); if (old) old.remove(); const k = n[b.dataset.t]; if (k) b.insertAdjacentHTML('beforeend', `<span class="tb">${k}</span>`); });
  }
  function setDirty(v) { dirty = v; document.body.style.paddingBottom = v ? '76px' : ''; let bar = $('#savebar'); if (!v) { if (bar) bar.remove(); return; }
    if (!bar) { document.body.insertAdjacentHTML('beforeend', '<div class="savebar" id="savebar"><span>設定有變更還沒儲存</span><button class="btn small" id="savebar-btn">儲存設定</button></div>'); $('#savebar-btn').onclick = () => $('#s-save') && $('#s-save').click(); } }
  async function show() {
    paintTabs(); if (settings) renderShopBar();
    app.oninput = app.onchange = null; // the settings page's "unsaved changes" watcher must not see the other tabs' switches
    if (tab === 'orders') return renderOrders();
    if (tab === 'inq') { if (!inqs) { app.innerHTML = '<div class="spinner"></div>'; await loadInqs(); } return renderInqs(); }
    if (tab === 'products') { if (!products.length || !settings) { app.innerHTML = '<div class="spinner"></div>'; if (!products.length) products = (await NTC.api('/admin/products')).products; if (!settings) await loadSettings(); } return renderProducts(); }

    renderSettings();
  }

  // ================= 訂單 =================
  const isOpen = (o) => !['done', 'cancelled'].includes(o.status);
  function renderOrders() {
    const counts = { open: orders.filter(isOpen).length, all: orders.length };
    Object.keys(statuses).forEach((k) => (counts[k] = orders.filter((o) => o.status === k).length));
    let list = filter === 'all' ? orders : filter === 'open' ? orders.filter(isOpen) : orders.filter((o) => o.status === filter);
    if (sortBy === 'date') list = [...list].sort((a, b) => a.date.localeCompare(b.date) || a.orderNo.localeCompare(b.orderNo));
    else if (filter === 'open') list = [...list.filter((o) => o.status === 'reported'), ...list.filter((o) => o.status !== 'reported')]; // transfers waiting to be confirmed come first
    const chip = (k, t) => `<button class="${filter === k ? 'on' : ''}" data-f="${k}">${t} ${counts[k] || 0}</button>`;

      <div class="statusbar one" style="margin-bottom:10px">${chip('open', '處理中')}${Object.entries(statuses).filter(([k]) => counts[k] || filter === k).map(([k, t]) => chip(k, t)).join('')}${chip('all', '全部')}</div>
      <div class="row" style="margin-bottom:10px"><span class="note">${list.length} 筆</span><span class="sp"></span>
        <div class="statusbar"><button data-s="created" class="${sortBy === 'created' ? 'on' : ''}">依下單時間</button><button data-s="date" class="${sortBy === 'date' ? 'on' : ''}">依出貨日期</button></div></div>
      ${list.map((o) => `<button class="ord${o.status === 'reported' ? ' needs' : ''}" data-no="${esc(o.orderNo)}">
        <div class="top"><b>${esc(o.orderNo)}</b><span class="status-pill ${esc(o.status)}">${esc(o.statusLabel)}</span>${o.byShop ? '<span class="flag" style="background:#e2ecf7;color:#2d5785">店家測試單</span>' : ''}<span class="sp"></span><span class="amt">${money(o.total)}</span></div>
        <div class="mid">📅 ${NTC.fmtDate(o.date)}　👤 ${esc(o.contact.name)}　${esc(PAY[o.payment.method] || '')}
          ${o.payment.status === 'paid' ? '<span class="flag ok">已收款</span>' : o.payment.last5 ? `<span class="flag">回報末五碼 ${esc(o.payment.last5)}</span>` : '<span class="flag">未付款</span>'}<br>
          ${esc(o.lines.map((l) => `${l.name}×${l.qty}`).join('、'))}${o.note ? `<br>💬 ${esc(o.note.slice(0, 60))}` : ''}</div>${o.status === 'reported' ? `<span class="todo">👉 客人說已匯款${o.payment.last5 ? `（末五碼 ${esc(o.payment.last5)}）` : ''}，核對後點進來按「確認已收到款項」</span>` : ''}</button>`).join('') || '<p class="empty note">沒有訂單</p>'}`;
    app.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { filter = b.dataset.f; renderOrders(); }));
    app.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => { sortBy = b.dataset.s; renderOrders(); }));
    app.querySelectorAll('.ord').forEach((b) => (b.onclick = () => openOrder(orders.find((o) => o.orderNo === b.dataset.no))));
  }
  function openOrder(o) {
    const p = o.payment;
    const { el, close } = NTC.sheet(`
      <h2>${esc(o.orderNo)} <span class="status-pill ${esc(o.status)}">${esc(o.statusLabel)}</span></h2>
      <p class="sub">下單 ${new Date(o.createdAt).toLocaleString('zh-TW', { hour12: false })}${o.user ? `・LINE：${esc(o.user.name)}` : '・未登入 LINE'}</p>
      <div class="panel" style="padding:12px">
        ${o.lines.map((l) => `<div class="row" style="padding:4px 0;align-items:flex-start"><div style="flex:1"><b>${esc(l.name)}</b> × ${l.qty}${l.detail ? `<div class="note">${esc(l.detail)}</div>` : ''}</div><b>${money(l.subtotal)}</b></div>`).join('')}
        <div class="row" style="border-top:1px dashed #ead7cc;margin-top:6px;padding-top:6px"><span>運費 ${esc(o.shipping.label)}</span><span class="sp"></span><span>${money(o.shipping.fee)}</span></div>

        <dt>收件人</dt><dd>${esc(o.contact.name)}</dd><dt>手機</dt><dd><a href="tel:${esc(o.contact.phone)}">${esc(o.contact.phone)}</a></dd><dt>地址</dt><dd>${esc(o.contact.address)}</dd>
        <dt>客人備註</dt><dd style="white-space:pre-wrap;font-weight:500">${o.note ? esc(o.note) : '<span class="muted">（無）</span>'}</dd>

          ${p.last5 ? `<br>客人回報末五碼 <b>${esc(p.last5)}</b>` : ''}${p.info ? `<br>${p.info.kind === 'atm' ? `ATM ${esc(p.info.bankCode)}-${esc(p.info.account)}` : `超商代碼 ${esc(p.info.code)}`}` : ''}

      <p style="font-weight:700;margin:0 0 6px">訂單狀態</p>
      <div class="statusbar" id="o-status" style="margin-bottom:12px">${Object.entries(statuses).map(([k, t]) => `<button data-k="${k}" class="${k === o.status ? 'on' : ''}">${t}</button>`).join('')}</div>
      <label class="field"><span>給客人看的留言（顯示在客人的訂單頁）</span><input id="o-msg" value="${esc(o.adminMessage)}" maxlength="500" placeholder="例如：已出貨，黑貓單號 1234-5678-9012"></label>
      <label class="field"><span>內部備註（只有店家看得到）</span><textarea id="o-note" maxlength="1000">${esc(o.adminNote)}</textarea></label>
      <button class="btn block" id="o-save">儲存</button>
      <div class="row" style="gap:8px;margin-top:10px"><a class="btn ghost small" style="flex:1" href="order.html?no=${esc(o.orderNo)}&t=${esc(o.token)}" target="_blank">客人看到的頁面</a>
        <button class="btn ghost small" style="flex:1" id="o-copy">複製客人連結</button></div>
      ${o.byShop ? '<button class="btn ghost block small" id="o-del" style="margin-top:10px;color:var(--red)">刪除這張測試單</button>'
        : canDeleteReal && o.status === 'cancelled' && p.status !== 'paid' ? '<button class="btn ghost block small" id="o-del" style="margin-top:10px;color:var(--red)">刪除這筆訂單（只有最大管理員看得到）</button>' : ''}
      ${(() => {
        const digits = (v) => String(v || '').replace(/\D/g, '');
        const same = orders.filter((x) => x.orderNo !== o.orderNo && ((o.user && x.user && x.user.sub === o.user.sub) || (digits(o.contact.phone).length >= 8 && digits(x.contact.phone) === digits(o.contact.phone))));
        return `<p style="font-weight:700;margin:14px 0 6px">這位客人的其他訂單（${same.length}）</p>${same.length ? same.map((x) => `<button class="ord" data-other="${esc(x.orderNo)}" style="padding:8px 12px;margin:0 0 6px"><div class="top"><b style="font-size:14px">${esc(x.orderNo)}</b><span class="status-pill ${esc(x.status)}">${esc(x.statusLabel)}</span><span class="sp"></span><span class="amt">${money(x.total)}</span></div><div class="mid" style="margin-top:2px">📅 ${NTC.fmtDate(x.date)}</div></button>`).join('') : '<p class="note" style="margin:0">沒有其他訂單</p>'}`;
      })()}
      <p style="font-weight:700;margin:14px 0 6px">紀錄</p><div class="hist">${(o.history || []).map((h) => `${new Date(h.at).toLocaleString('zh-TW', { hour12: false })}　${esc(h.note)}`).join('<br>')}</div>`);

    el.querySelectorAll('#o-status button').forEach((b) => (b.onclick = () => { status = b.dataset.k; el.querySelectorAll('#o-status button').forEach((x) => x.classList.toggle('on', x === b)); }));
    const save = async (extra = {}) => {
      NTC.loading(true, '儲存中…');

        const d = el.querySelector('#o-date').value; if (d && d !== o.date) body.date = d;
        if (body.status === 'cancelled' && o.status !== 'cancelled' && !confirm(`確定取消 ${o.orderNo}？`)) { NTC.loading(false); return; }
        if (['paid', 'making', 'shipped', 'done'].includes(body.status) && body.status !== o.status && o.payment.status !== 'paid' && !body.markPaid) {
          if (!confirm(moneyCheck())) { NTC.loading(false); return; }
          body.markPaid = true;
        }
        const { order } = await NTC.api(`/admin/orders/${o.orderNo}`, { method: 'PATCH', body });
        orders = orders.map((x) => (x.orderNo === order.orderNo ? order : x));
        close(); renderOrders(); NTC.toast('已儲存');
      } catch (e) { NTC.toast(e.message, 3500); } finally { NTC.loading(false); }
    };

    if (delBtn) delBtn.onclick = async () => {
      if (!confirm(o.byShop ? `確定刪除測試單 ${o.orderNo}？刪掉就找不回來。` : `確定刪除客人的訂單 ${o.orderNo}（${o.contact.name}）？\n刪除後客人的訂單連結也會失效，而且找不回來。`)) return;
      if (!o.byShop && !confirm('再確認一次：真的要永久刪除這筆訂單？')) return;
      NTC.loading(true, '刪除中…');
      try { await NTC.api(`/admin/orders/${o.orderNo}`, { method: 'DELETE' }); orders = orders.filter((x) => x.orderNo !== o.orderNo); close(); renderOrders(); NTC.toast(o.byShop ? '已刪除測試單' : '已刪除訂單'); }
      catch (e) { NTC.toast(e.message, 3500); } finally { NTC.loading(false); }
    };
    function moneyCheck() {
      return `這筆訂單還沒確認收款。\n\n請先到網銀確認已經收到：\n金額 ${money(o.total)}${o.payment.last5 ? `\n客人帳號末五碼 ${o.payment.last5}` : '\n（客人還沒回報末五碼）'}\n\n確定錢已經入帳了嗎？`;
    }
    const paid = el.querySelector('#o-paid'); if (paid) paid.onclick = () => { if (confirm(moneyCheck())) save({ markPaid: true }); };
    el.querySelector('#o-copy').onclick = async () => {
      const url = new URL(`order.html?no=${o.orderNo}&t=${o.token}`, location.href).href;
      try { await navigator.clipboard.writeText(url); NTC.toast('已複製，可以貼給客人'); } catch (e) { prompt('客人訂單連結', url); }
    };
  }

  // ================= 客製詢問 =================

  function inqOpen(x) { return ['new', 'talking', 'quoted'].includes(x.status); } // a function (hoisted): the ?inq= link can render before this line runs
  function renderInqs() {

  async function shrink(file) {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(file); });
    const scale = Math.min(1, 900 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    for (const qv of [0.85, 0.75, 0.62, 0.5]) { const d = c.toDataURL('image/webp', qv); if (d.startsWith('data:image/webp') && d.length < 370000) return d; const j = c.toDataURL('image/jpeg', qv); if (j.length < 370000) return j; }
    throw new Error('圖片太大');
  }

      <section class="panel"><h2>可麗露禮盒規則</h2>

      <section class="panel"><h2>造型餅乾規則</h2>

        <div id="s-reqs"></div>
        <p style="font:900 15px var(--serif);margin:4px 0 4px">＋ 新增管理員</p>
        <p class="note" style="margin:0 0 8px">輸入對方的手機號碼和名字 → 請對方在 LINE 打開後台（<code>liff.line.me/2012677349-KI6PM6Pz/admin.html</code>），輸入同一個手機號碼，就會成為管理員，以後在 LINE 打開會自動進來。每個號碼只能綁一個 LINE 帳號。</p>
        ${(s.adminPhones || []).map((p) => `<div class="row" style="padding:5px 0"><span class="sp">${esc(p.phone.replace(/^(\d{4})(\d{3})(\d+)$/, '$1-$2-$3'))}${p.label ? `（${esc(p.label)}）` : ''}　${p.owner ? '<span class="flag ok">固定・最大權限</span>' : p.boundSub ? `<span class="flag ok">已綁定 ${esc(p.boundName || '')}</span>` : '<span class="flag">等待綁定</span>'}</span>${p.owner ? '' : `<button class="tag-del" data-rmphone="${esc(p.phone)}">移除</button>`}</div>`).join('') || '<p class="note" style="margin:0 0 6px">還沒有新增</p>'}

        <p class="note" style="margin:10px 0 6px">把這個連結傳給要加入的人，用 LINE 打開一次就會變成管理員：</p>
        <code>${esc(liffInvite || inviteUrl)}</code>
        <div class="row" style="gap:8px;margin-top:8px"><button class="btn ghost small" id="s-copyinv" style="flex:1">複製邀請連結</button><button class="btn ghost small" id="s-rotate" style="flex:1">換一個新連結</button></div></section>`;
    let week = [...s.closedWeekdays]; let blocked = [...s.blockedDates];
    app.querySelectorAll('#s-week .chip').forEach((b) => (b.onclick = () => { const d = +b.dataset.d; week = week.includes(d) ? week.filter((x) => x !== d) : [...week, d]; b.classList.toggle('on'); }));

    $('#s-addbtn').onclick = () => { const v = $('#s-addday').value; if (v && !blocked.includes(v)) { blocked.push(v); $('#s-blocked').insertAdjacentHTML('beforeend', `<button type="button" class="tag-del" data-d="${v}">${v} ✕</button>`); $('#s-blocked .note')?.remove(); $('#s-blocked').lastElementChild.onclick = (e) => { blocked = blocked.filter((x) => x !== v); e.target.remove(); }; } };
    const put = async (body, msg = '已儲存') => {
      NTC.loading(true, '儲存中…');
      try { settings = (await NTC.api('/admin/settings', { method: 'PUT', body })).settings; renderSettings(); renderShopBar(); NTC.toast(msg); }
      catch (e) { NTC.toast(e.message, 3500); } finally { NTC.loading(false); }
    };
    $('#s-save').onclick = () => put({
      leadDays: +$('#s-lead').value, maxDays: +$('#s-max').value, maxOrdersPerDay: +$('#s-perday').value, closedWeekdays: week, blockedDates: blocked,
      dateLabel: $('#s-datelabel').value.trim() || '希望到貨日期',
      shipping: { frozen: { label: s.shipping.frozen.label, maxPerParcel: +$('#s-maxbox').value, tiers: [...app.querySelectorAll('#s-tiers [data-i]')].map((r) => ({ upTo: +r.querySelector('.tu').value, fee: +r.querySelector('.tf').value })) },
        ambient: { label: s.shipping.ambient.label, tiers: [...app.querySelectorAll('#s-atiers [data-i]')].map((r) => ({ upTo: +r.querySelector('.tu').value, fee: +r.querySelector('.tf').value })) } },
      dateNote: $('#s-datenote').value.trim(),
      freeShippingOver: +$('#s-free').value,
      payments: { linepay: $('#s-p-lp').checked, ecpay: $('#s-p-ec').checked, transfer: $('#s-p-tr').checked },
      bank: { name: $('#s-bname').value.trim(), code: $('#s-bcode').value.trim(), account: $('#s-bacc').value.trim(), holder: $('#s-bholder').value.trim() },
      transferDays: +$('#s-tdays').value,
      cookie: { ...s.cookie, minPieces: +$('#s-cmin').value, shipping: { label: $('#s-clabel').value.trim(), tiers: [...app.querySelectorAll('#s-ctiers [data-i]')].map((r) => ({ upTo: +r.querySelector('.tu').value, fee: +r.querySelector('.tf').value })) } },
      canele: { ...c, assortedPrice: +$('#s-aprice').value, singleMinBoxes: +$('#s-smin').value, modes: c.modes.map((m, i) => ({ ...m, minBoxes: +app.querySelector(`.s-mode[data-i="${i}"]`).value })) },
      notice: $('#s-notice').value.trim(),
      shopNotes: { over: Object.fromEntries([...app.querySelectorAll('.sn-over')].map((t) => [t.dataset.k, t.value.trim()]).filter(([, v]) => v)),
        off: [...app.querySelectorAll('.sn-show')].filter((c) => !c.checked).map((c) => c.dataset.k),
        extra: [...app.querySelectorAll('#sn-extra .sn-x')].map((r) => ({ title: r.querySelector('.snt').value.trim(), text: r.querySelector('.snx').value.trim() })).filter((x) => x.title || x.text) },
      testMode: $('#s-test').checked,
      pauseOrders: $('#s-pause').checked,
    });
    $('#s-ctadd').onclick = () => { const box = $('#s-ctiers'); const n = box.children.length; const last = box.lastElementChild; const from = last ? +last.querySelector('.tu').value + 1 : 1;
      box.insertAdjacentHTML('beforeend', `<div class="grid2" data-i="${n}"><label class="field"><span>${from} 片 ～ 幾片</span><input class="tu" type="number" min="1" value="${from + 5}"></label><label class="field"><span>運費</span><input class="tf" type="number" min="0" value="${last ? last.querySelector('.tf').value : 0}"></label></div>`); };
    $('#s-ctrm').onclick = () => { const box = $('#s-ctiers'); if (box.children.length > 1) box.lastElementChild.remove(); else NTC.toast('至少要留一級'); };
    // 購物須知: the text that is written automatically comes from what customers really get (/catalog), so it always matches the saved settings
    NTC.api('/catalog').then((c) => { NTC.shopNotes(c.settings).forEach((r) => { const el = app.querySelector(`.sn-auto[data-k="${r.key}"]`); if (el) el.textContent = `自動寫好的：${r.auto}`; }); })
      .catch(() => app.querySelectorAll('.sn-auto').forEach((el) => (el.textContent = '（自動寫好的內容暫時讀不到，不影響儲存）')));
    $('#sn-add').onclick = () => { const box = $('#sn-extra'); if (box.children.length >= 10) return NTC.toast('最多 10 則'); box.insertAdjacentHTML('beforeend', snExtraRow({})); box.lastElementChild.querySelector('.snt').focus(); setDirty(true); };
    $('#sn-extra').onclick = (e) => { const d = e.target.closest('.sn-del'); if (d) { d.closest('.sn-x').remove(); setDirty(true); } };
    // tier rows: when an upper limit changes, the next row's 「從幾個起」 label follows
    [['#s-tiers', '盒'], ['#s-ctiers', '片'], ['#s-atiers', '罐']].forEach(([q, u]) => { const box = $(q); if (!box) return;
      const relabel = () => [...box.children].forEach((r, i, all) => { const sp = r.querySelector('label span'); if (sp) sp.textContent = `${i === 0 ? 1 : (+all[i - 1].querySelector('.tu').value || 0) + 1} ${u} ～ 幾${u}`; });
      box.addEventListener('input', relabel); new MutationObserver(relabel).observe(box, { childList: true }); });
    $('#s-atadd').onclick = () => { const box = $('#s-atiers'); const last = box.lastElementChild; const from = last ? +last.querySelector('.tu').value + 1 : 1;
      box.insertAdjacentHTML('beforeend', `<div class="grid2" data-i="${box.children.length}"><label class="field"><span>${from} 罐 ～ 幾罐</span><input class="tu" type="number" min="1" value="999"></label><label class="field"><span>運費</span><input class="tf" type="number" min="0" value="${last ? last.querySelector('.tf').value : 0}"></label></div>`); };
    $('#s-atrm').onclick = () => { const box = $('#s-atiers'); if (box.children.length > 1) box.lastElementChild.remove(); else NTC.toast('至少要留一級'); };
    $('#s-logout').onclick = async () => { if (confirm('登出這支裝置的後台？')) { NTC.setAdminToken(''); await NTC.logout(); location.replace('index.html'); } };
    NTC.api('/admin/requests').then(({ requests }) => {
      const box = $('#s-reqs'); if (!box || !requests.length) return;
      box.innerHTML = `<div style="background:#fff6ec;border-radius:12px;padding:10px 12px;margin-bottom:10px"><b style="font-size:14px">申請成為管理員（${requests.length}）</b>${requests.map((r) => `<div class="row" style="padding:6px 0">${r.picture ? `<img src="${esc(r.picture)}" style="width:30px;height:30px;border-radius:50%" alt="">` : ''}<span class="sp">${esc(r.name)}</span><button class="btn small" data-ok="${esc(r.sub)}">核准</button><button class="tag-del" data-no="${esc(r.sub)}">拒絕</button></div>`).join('')}<p class="note" style="margin:4px 0 0">只核准你認識的人：管理員看得到所有客人的姓名、電話、地址。</p></div>`;
      const asec = box.closest('section.acc'); if (asec && !asec.classList.contains('open')) asec.querySelector('.acc-h').click(); // someone is waiting for approval: open 管理員
      box.querySelectorAll('[data-ok],[data-no]').forEach((b) => (b.onclick = async () => {
        const sub = b.dataset.ok || b.dataset.no; const ok = !!b.dataset.ok;
        if (ok && !confirm('確定讓這個 LINE 帳號成為管理員？')) return;

      }));
    }).catch(() => {});
    $('#s-addphonebtn').onclick = () => { const phone = $('#s-addphone').value.trim(); if (!phone) return; put({ addAdminPhones: [{ phone, label: $('#s-addlabel').value.trim() }] }, '已新增，請對方在 LINE 打開後台輸入這個手機號碼'); };
    app.querySelectorAll('[data-rmphone]').forEach((b) => (b.onclick = () => { if (confirm('移除這個管理員手機？（已經綁定的 LINE 帳號要在下面的管理員名單另外移除）')) put({ removeAdminPhones: [b.dataset.rmphone] }, '已移除'); }));
    $('#s-copyinv').onclick = async () => { try { await navigator.clipboard.writeText(liffInvite || inviteUrl); NTC.toast('已複製'); } catch (e) { prompt('邀請連結', liffInvite || inviteUrl); } };
    $('#s-rotate').onclick = () => { if (confirm('換新連結後，舊的邀請連結就失效（已經是管理員的人不受影響）。')) put({ rotateInvite: true }, '已換新連結'); };
    app.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { if (confirm('移除這位管理員？')) put({ removeAdmins: [b.dataset.rm] }, '已移除'); }));
    foldSettings();
  }
  // each settings section folds to its title + a one-line summary of what is set; fields stay in the page, so 儲存設定 still saves everything
  function foldSettings() {
    const s = settings; const pays = [s.payments.transfer && '銀行轉帳', s.payments.linepay && 'LINE Pay', s.payments.ecpay && '信用卡／ATM／超商'].filter(Boolean);
    const sum = {
      接單日期: `最早今天＋${s.leadDays} 天${(s.closedWeekdays || []).length ? '・公休週' + [...s.closedWeekdays].sort().map((d) => '日一二三四五六'[d]).join('') : ''}${(s.blockedDates || []).length ? `・${s.blockedDates.length} 天不接單` : ''}`,
      運費: `冷凍 ${money(s.shipping.frozen.tiers[0].fee)} 起・馬林糖 ${money((s.shipping.ambient.tiers || [{ fee: s.shipping.ambient.fee }])[0].fee)} 起${s.freeShippingOver ? `・滿 ${money(s.freeShippingOver)} 免運` : ''}`,
      付款方式: (pays.join('、') || '還沒開任何付款方式') + (s.testMode ? '・測試模式開著' : ''),
      可麗露禮盒規則: `綜合禮盒 ${money(s.canele.assortedPrice)}／盒`,
      造型餅乾規則: `${s.cookie.minPieces} 片起訂・運費 ${money(s.cookie.shipping.tiers[0].fee)} 起`,
      公告: s.notice ? s.notice.slice(0, 18) : '沒有公告',
      購物須知: (() => { const n = s.shopNotes || {}; const a = Object.keys(n.over || {}).length; const x = (n.extra || []).length; const h = (n.off || []).length;
        return [a && `${a} 則自己寫`, x && `${x} 則自己加`, h && `${h} 則隱藏`].filter(Boolean).join('・') || '全部自動寫好'; })(),
      這支裝置: '登出',
      管理員: `${(s.admins || []).length} 位`,
    };
    app.querySelectorAll('section.panel').forEach((sec) => {
      const h = sec.querySelector(':scope > h2'); if (!h) return; const title = h.textContent.trim();
      const body = document.createElement('div'); while (h.nextSibling) body.appendChild(h.nextSibling);
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'acc-h'; btn.innerHTML = `<b>${esc(title)}</b><small>${esc(sum[title] || '')}</small><i class="chev"></i>`;
      h.replaceWith(btn); sec.appendChild(body); sec.classList.add('acc'); sec.dataset.acc = title;
      const set = (open) => { sec.classList.toggle('open', open); body.hidden = !open; btn.setAttribute('aria-expanded', open); };
      set(openAcc.has(title)); btn.onclick = () => { openAcc.has(title) ? openAcc.delete(title) : openAcc.add(title); set(openAcc.has(title)); };
    });
    // 暫停接單 is the big switch at the top of this page: keep its value for saving, don't show it a second time
    const pz = $('#s-pause'); if (pz) { const row = pz.closest('label'); row.hidden = true; if (row.nextElementSibling && row.nextElementSibling.matches('p.note')) row.nextElementSibling.hidden = true; }
    setDirty(false);
    const mark = (e) => { if (!e.target.closest('#s-addphone, #s-addlabel, #s-addday')) setDirty(true); }; // typing a new admin phone / date to add isn't a setting yet
    app.oninput = mark; app.onchange = mark;
    ['#s-week', '#s-blocked', '#s-addbtn', '#s-ctadd', '#s-ctrm', '#s-atadd', '#s-atrm'].forEach((q) => { const el = $(q); if (el) el.addEventListener('click', () => setDirty(true)); });
  }

  show();
})();
</script>
</body>
</html>
