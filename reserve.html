<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://n7tzxjzhjty5cngobe4wy7zlxe0efyyj.lambda-url.ap-northeast-1.on.aws" crossorigin>
<script>/* stale-page guard, part 1 (see js/app.js) */try{(function(d){var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(n&&n.transferSize>0)return;d.className+=' vchk';setTimeout(function(){d.classList.remove('vchk')},1200)})(document.documentElement)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf4ed">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/app.css?v=1125b">
<link rel="stylesheet" href="css/storefront.css?v=1121i">
<link rel="stylesheet" href="css/reserve.css?v=1121i">
<title>預約／訂購｜N.T Cookie × N.T Canelé</title>
<meta name="description" content="選擇希望到貨的日期，再挑選可麗露禮盒、造型餅乾與馬林糖一口酥。">
</head>
<body class="storefront reserve-page">
<header class="store-header">
  <a class="store-back" id="back" href="index.html" aria-label="返回上一頁"><span aria-hidden="true"></span></a>
  <p class="store-brand" lang="en" data-edit="brand.name" data-edit-label="最上面的店名（商店、分類、預約三頁一起）">N.T Cookie</p>
  <a class="store-orders reserve-cart" href="cart.html">購物車 <span class="badge" data-cart-count></span></a>
</header>
<main class="store-main reserve-main">
  <section class="store-intro" aria-labelledby="reserve-title">
    <p class="store-kicker" data-edit="reserve.kicker" data-edit-label="標題上面的小字">手作甜點・預訂商店</p>
    <h1 id="reserve-title" data-edit="reserve.title" data-edit-label="預約頁的標題">預約／訂購</h1>
  </section>
  <div id="app" aria-busy="true"><p class="reserve-loading" role="status">正在查詢可預約日期…</p></div>
</main>
<script src="js/config.js?v=1126c"></script>
<script src="js/app.js?v=1126c"></script>
<script src="js/shop.js?v=1123k"></script>
<script>
(async function () {
  const { $, esc } = NTC;
  $('#back').addEventListener('click', (event) => {
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    NTC.back();
  });
  const app = $('#app');
  const askUrl = NTC.chatUrl('您好，我想預約／查詢檔期');
  NTC.refreshCart();

  const showStatus = (title, message, action) => {
    app.innerHTML = `
      <section class="reserve-card reserve-status" id="reserve-status" aria-labelledby="reserve-status-title">
        <h2 id="reserve-status-title">${title}</h2>
        <p>${esc(message)}</p>
        ${action}
        <a class="reserve-link" id="reserve-browse" href="shop.html">先逛逛甜點</a>
      </section>`;
  };
  const contact = `<a class="reserve-primary" href="${askUrl}">用 LINE 詢問檔期</a>`;

  let cat;
  try {
    cat = await NTC.catalog();
  } catch (error) {
    showStatus('暫時無法查詢日期', error.message,
      '<button class="reserve-primary" id="reserve-retry" type="button">重新查詢</button>');
    $('#reserve-retry').onclick = () => location.reload();
    return;
  } finally {
    app.setAttribute('aria-busy', 'false');
  }

  const S = cat.settings;
  if (S.pauseOrders) {
    showStatus('目前暫停線上接單', S.notice || '歡迎先看看甜點，或用 LINE 向我們詢問檔期。', contact);
    return;
  }

  const fullDates = cat.fullDates || [];
  const rules = NTC.dateRules(S, fullDates);
  let earliest = rules.min;
  while (earliest <= rules.max && !rules.ok(earliest)) earliest = NTC.addDays(earliest, 1);
  if (earliest > rules.max) {
    showStatus('目前沒有可預約的日期', '這一輪的預約日期已額滿或未開放。歡迎用 LINE 詢問其他檔期。', contact);
    return;
  }

  let date = NTC.date.get();
  if (!rules.ok(date)) date = '';
  app.innerHTML = `
    <section class="reserve-card" aria-labelledby="date-title">
      <h2 id="date-title">${esc(S.dateLabel || '希望到貨日期')}</h2>
      <p class="reserve-earliest" id="reserve-earliest">最早可選 <strong>${NTC.fmtDate(earliest)}</strong></p>
      <p class="reserve-date-note">${esc(S.dateNote || '每一份甜點都是接單後手工製作。')}</p>
      <div id="cal"></div>
      <div class="reserve-next">
        <p id="picked" role="status"></p>
        <a class="reserve-link" id="reserve-browse" href="shop.html">先逛逛甜點</a>
      </div>
    </section>
    <footer class="reserve-help" aria-label="預約協助">
      <a class="reserve-link" href="custom.html">客製詢問</a>
      <a class="reserve-link" href="${askUrl}">LINE 詢問檔期</a>
    </footer>`;

  const calendar = $('#cal');
  const browse = $('#reserve-browse');
  const syncCalendarSelection = () => {
    calendar.querySelectorAll('.days button:not(:disabled)').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.classList.contains('on')));
    });
  };
  const paint = () => {
    $('#picked').textContent = date ? `已選 ${NTC.fmtDate(date)}` : '選好日期，就能開始挑選甜點。';
    browse.textContent = date ? '挑選甜點' : '先逛逛甜點';
    browse.className = date ? 'reserve-primary' : 'reserve-link';
    syncCalendarSelection();
  };
  NTC.calendar(calendar, { settings: S, fullDates, value: date, onChange: (d) => {
    date = d;
    NTC.date.set(d);
    paint();
    calendar.querySelector('.days button.on')?.focus({ preventScroll: true });
  } });
  calendar.addEventListener('click', (event) => {
    const nav = event.target.closest('button[data-nav]');
    if (!nav) return;
    syncCalendarSelection();
    const activeNav = calendar.querySelector(`button[data-nav="${nav.dataset.nav}"]:not(:disabled)`);
    (activeNav || calendar.querySelector('.cal .hd button:not(:disabled)'))?.focus({ preventScroll: true });
  });
  paint();
})();
</script>
</body>
</html>
