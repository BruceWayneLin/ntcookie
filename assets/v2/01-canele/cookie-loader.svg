<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 216" role="img" aria-labelledby="title">
  <title id="title">Canelé</title>
  <view id="still" viewBox="0 0 240 216"/>
  <defs>
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="white"/>
      <g fill="black">
        <circle cx="54" cy="11" r="9.5"/>
        <circle cx="61" cy="25" r="5.5"/>
      </g>
    </mask>
    <radialGradient id="shadow">
      <stop stop-color="#a86455" stop-opacity=".19"/>
      <stop offset="1" stop-color="#a86455" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .cookie { transform-origin: 32px 32px; }
    @media (prefers-reduced-motion: no-preference) {
      .cookie { animation: turn 3.6s linear infinite; }
      .wordmark { animation: hop 1.8s ease-in-out infinite; }
    }
    #still:target ~ g .cookie, #still:target ~ .wordmark { animation: none; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes hop {
      0%, 60%, 100% { transform: translateY(0); }
      26% { transform: translateY(-4px); }
      45% { transform: translateY(1px); }
    }
  </style>

  <ellipse cx="120" cy="150" rx="44" ry="5" fill="url(#shadow)"/>
  <!-- The shop's original bitten cookie with its scalloped pink icing. -->
  <g transform="translate(52 12) scale(2.125)">
    <g class="cookie">
      <g mask="url(#bite)">
        <circle cx="32" cy="32" r="29" fill="#c98a4b"/>
        <circle cx="32" cy="32" r="26.5" fill="#e6b377"/>
        <g fill="#fbcbd5">
          <circle cx="32" cy="32" r="16.5"/>
          <circle cx="47.5" cy="32" r="6.6"/><circle cx="43" cy="43" r="6.6"/>
          <circle cx="32" cy="47.5" r="6.6"/><circle cx="21" cy="43" r="6.6"/>
          <circle cx="16.5" cy="32" r="6.6"/><circle cx="21" cy="21" r="6.6"/>
          <circle cx="32" cy="16.5" r="6.6"/><circle cx="43" cy="21" r="6.6"/>
        </g>
        <g fill="none" stroke-linecap="round" stroke-width="3.2">
          <path d="M23 27l4-2.4" stroke="#fff"/><path d="M36 21.5l3 3.2" stroke="#ffd35c"/>
          <path d="M40.5 33.5l4.4 1" stroke="#7fd1c0"/><path d="M27 38.5l-3 3.4" stroke="#f07f9b"/>
          <path d="M34.5 41l1.2 4.2" stroke="#fff"/><path d="M30 31.5l3.6.8" stroke="#b596f2"/>
          <path d="M19.5 33l.6 3.6" stroke="#ffd35c"/>
        </g>
      </g>
    </g>
  </g>

  <path d="M43 74c-3-4-8-2-7 2 1 4 5 6 9 8 2-4 4-8 3-11-1-3-4-3-5 1Z" fill="#eaa7b4"/>
