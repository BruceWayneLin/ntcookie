<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf4ed">

<link rel="stylesheet" href="css/app.css?v=1125b">
<link rel="stylesheet" href="css/storefront.css?v=six">
<title>線上商店｜N.T Cookie × N.T Canelé</title>
<meta name="description" content="N.T Cookie × N.T Canelé 線上商店">
<style>
  /* a product line the owner opened in the admin (商品 → ＋ 新增分類): plain products, two to a row */
  .cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; margin: 6px 0 0; padding: 0; list-style: none; }
  .cat-card { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; padding: 7px 7px 12px; border: 1px solid #e7ccbb; border-radius: 14px;
    background: #fffaf6; color: var(--store-ink); text-align: center; cursor: pointer; font: inherit; -webkit-tap-highlight-color: transparent; }
  .cat-card:active { filter: brightness(.97); }
  .cat-card:focus-visible { outline: 2px solid var(--store-accent); outline-offset: 3px; }
  .cat-ph { display: block; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #f3e3d8; }
  .cat-ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cat-nm { display: block; margin: 9px 2px 0; font: 700 clamp(.9375rem, 4.1vw, 1.25rem)/1.35 var(--serif); overflow-wrap: anywhere; }
  .cat-pr { display: block; margin-top: auto; padding-top: 5px; color: #b0392a; font: 800 clamp(1rem, 4.4vw, 1.3rem)/1.2 var(--sans); }
  .cat-pr small { color: var(--store-muted); font-size: .78em; font-weight: 600; }
  .cat-card.sold .cat-ph img { filter: grayscale(.5) opacity(.55); }
  .cat-so { position: absolute; left: 7px; right: 7px; top: 7px; aspect-ratio: 1; display: grid; place-items: center; pointer-events: none; }
  .cat-so span { padding: 5px 16px; border-radius: 999px; background: rgba(60, 34, 23, .78); color: #fff; font: 700 .875rem/1.4 var(--sans); letter-spacing: .12em; }
  .cat-qty { position: absolute; right: 12px; top: 12px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px; background: var(--red, #c2392b); color: #fff; font: 700 .8125rem/26px var(--sans); }
  .cat-banner { margin: 2px 0 6px; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; background: #f3e3d8; }
  .cat-banner img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cat-ship { margin: 0 0 10px; padding: 8px 0; border-block: 1px solid var(--store-rule); color: var(--store-muted); font-size: .8125rem; text-align: center; }
  .cat-empty { margin: 34px 0 10px; text-align: center; color: var(--store-muted); font-size: .9375rem; line-height: 1.8; }
  .cat-empty a { color: var(--store-accent); font-weight: 700; }
  @media (min-width: 620px) { .cat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 14px; } }
</style>
</head>
<body class="storefront">
<header class="store-header">
  <a class="store-back" id="back" href="shop.html" aria-label="回線上商店"><span aria-hidden="true"></span>商店</a>
  <p class="store-brand" lang="en" data-edit="brand.name" data-edit-label="最上面的店名（商店、分類、預約三頁一起）">N.T Cookie</p>
  <a class="store-orders" href="orders.html">我的訂單</a>
</header>
<main class="store-main">
  <div class="cat-banner" id="cat-banner" hidden><img alt=""></div>
  <section class="store-intro" aria-labelledby="cat-title">
    <p class="store-kicker" data-edit="category.kicker" data-edit-label="標題上面的小字">手作甜點・預訂商店</p>
    <h1 id="cat-title">&nbsp;</h1>
    <p class="store-lead" id="cat-lead" hidden></p>
  </section>
  <p class="cat-ship" id="cat-ship" hidden></p>
  <ul class="cat-grid" id="cat-grid" aria-label="商品" aria-busy="true"></ul>
  <p class="cat-empty" id="cat-empty" hidden>這個分類目前沒有上架的商品。<br><a href="shop.html">回線上商店看看其他甜點 ›</a></p>
  <a class="nt-back" id="back2" href="shop.html"><i aria-hidden="true"></i>返回上一頁</a>
</main>
<script src="js/config.js?v=1126g"></script>
<script src="js/app.js?v=1126g"></script>
<script src="js/shop.js?v=1123k"></script>
<script>
  NTC.$('#back2').addEventListener('click', (event) => {
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    NTC.back();
  });
  NTC.mountCartBar();
  NTC.catalog().then((c) => {
    const e = NTC.esc; const id = new URLSearchParams(location.search).get('c') || '';
    const cat = (c.settings.categories || []).find((k) => k.id === id);
    const list = cat ? c.products.filter((p) => p.category === id) : [];
    NTC.$('#cat-title').textContent = cat ? cat.name : '線上商店';
    if (!cat || !list.length) { NTC.$('#cat-empty').hidden = false; return; }
    document.title = `${cat.name}｜N.T Cookie × N.T Canelé`;
    if (cat.photo) { const banner = NTC.$('#cat-banner'); banner.querySelector('img').src = NTC.asset(cat.photo); banner.hidden = false; } // banner → products → cart, like every other shop page
    if (cat.intro) { const lead = NTC.$('#cat-lead'); lead.innerHTML = e(cat.intro).replace(/\n/g, '<br>'); lead.hidden = false; }
    const ship = NTC.$('#cat-ship'); ship.textContent = `${cat.temp === 'frozen' ? '❄️ 冷凍宅配寄送' : '常溫宅配寄送'}・到貨日與運費在購物車確認`; ship.hidden = false;
    const grid = NTC.$('#cat-grid');
    grid.innerHTML = list.map((p) => `<li><button type="button" class="cat-card${p.soldOut ? ' sold' : ''}" data-id="${e(p.id)}" aria-label="${e(`${p.name} ${NTC.money(p.price)}／${p.unit || cat.unit}${p.soldOut ? '（售完）' : ''}`)}">
      <span class="cat-ph">${p.photo ? `<img src="${e(NTC.asset(p.photo))}" alt="" loading="lazy">` : ''}</span>
      <span class="cat-nm">${e(p.name)}</span>
      <span class="cat-pr">${NTC.money(p.price)}<small> / ${e(p.unit || cat.unit)}</small></span>
      ${p.soldOut ? '<span class="cat-so"><span>售完</span></span>' : ''}<span class="cat-qty" hidden></span></button></li>`).join('');
    grid.querySelectorAll('.cat-card').forEach((b) => b.addEventListener('click', () => {
      const p = list.find((x) => x.id === b.dataset.id);
      if (p.soldOut) { NTC.toast(`「${p.name}」目前售完，下次請早 ♡`); return; }
      NTC.openProduct({ ...p, unit: p.unit || cat.unit });
    }));
    const badges = () => grid.querySelectorAll('.cat-card').forEach((b) => { const q = NTC.cart.qtyOf(b.dataset.id); const s = b.querySelector('.cat-qty'); s.hidden = !q; s.textContent = q ? `×${q}` : ''; });
    badges(); document.addEventListener('ntc:cart', badges);
  }).catch((err) => NTC.toast(err.message, 4000))
    .finally(() => NTC.$('#cat-grid').setAttribute('aria-busy', 'false'));
</script>
</body>
</html>
