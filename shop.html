<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf4ed">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/app.css?v=1122c">
<link rel="stylesheet" href="css/storefront.css?v=custom-orders-banner">
<title>線上商店｜N.T Cookie × N.T Canelé</title>
<meta name="description" content="N.T Cookie × N.T Canelé 線上商店：可麗露禮盒、馬林糖一口酥，線上下單、LINE Pay 付款。">
</head>
<body class="storefront">
<header class="store-header">
  <a class="store-back" id="back" href="index.html" aria-label="回首頁"><span aria-hidden="true"></span>首頁</a>
  <p class="store-brand" lang="en">N.T Cookie</p>
  <a class="store-orders" href="orders.html">我的訂單</a>
</header>
<main class="store-main">
  <section class="store-intro" aria-labelledby="store-title">
    <p class="store-kicker">手作甜點・預訂商店</p>
    <h1 id="store-title">把心意，做成甜點</h1>
    <p class="store-lead">造型餅乾與法式可麗露，為每個日子加點甜。</p>
  </section>
  <div class="store-filters" role="group" aria-label="篩選甜點分類" hidden>
    <button type="button" data-filter="all" aria-controls="collections" aria-pressed="true">全部</button>
    <button type="button" data-filter="cookie" aria-controls="collections" aria-pressed="false">造型餅乾</button>
    <button type="button" data-filter="gift" aria-controls="collections" aria-pressed="false">送禮小點</button>
    <button type="button" data-filter="canele" aria-controls="collections" aria-pressed="false">可麗露</button>
  </div>
  <ul class="store-collections" id="collections" aria-label="甜點分類">
    <li data-collection="cookie">
      <a href="cookies.html?g=character">
        <img src="assets/v2/03-homepage/category-character-cookies.webp" width="464" height="234" alt="">
        <h2 class="sr-only">卡通・收涎 造型餅乾</h2>
      </a>
    </li>
    <li data-collection="cookie">
      <a href="cookies.html?g=birthday">
        <img src="assets/v2/03-homepage/category-birthday-cookies.webp" width="462" height="234" alt="">
        <h2 class="sr-only">慶生・抓週 造型餅乾</h2>
      </a>
    </li>
    <li data-collection="gift">
      <a href="meringue.html">
        <img src="assets/v2/03-homepage/category-meringue-cookies.webp" width="464" height="246" alt="">
        <h2 class="sr-only">馬林糖一口酥・送禮小點</h2>
      </a>
    </li>
    <li data-collection="canele">
      <a href="canele.html">
        <img src="assets/v2/03-homepage/category-canele.webp" width="462" height="246" alt="">
        <h2 class="sr-only">N.T Canelé 可麗露專區</h2>
      </a>
    </li>
    <li data-collection="cookie" data-group="chinese">
      <a href="cookies.html?g=chinese">
        <img src="assets/card-chinese.webp" width="590" height="307" alt="">
        <h2 class="sr-only">中國風造型餅乾</h2>
      </a>
    </li>
    <li data-collection="cookie">
      <a href="custom.html">
        <img class="store-custom-banner" src="assets/shop/custom-orders-banner.jpg" width="1672" height="941" alt="">
        <h2 class="sr-only">客製專區・寵物、精品、紀念造型餅乾，詢問報價</h2>
      </a>
    </li>
  </ul>
  <p class="sr-only" id="filter-status" role="status"></p>
  <a class="nt-back" id="back2" href="index.html"><i aria-hidden="true"></i>返回上一頁</a>
</main>
<footer class="store-footer" aria-label="購物資訊">
  <button type="button" id="show-shopping-info" aria-haspopup="dialog" hidden>購物須知</button>
  <a href="https://line.me/R/oaMessage/%40ntcookie/">聯絡我們</a>
  <a href="https://shopee.tw/shop/3945339" target="_blank" rel="noopener">蝦皮賣場 <span aria-hidden="true">↗</span></a>
</footer>
<dialog class="store-info" id="shopping-info" aria-labelledby="shopping-title">
  <h2 id="shopping-title">購物須知</h2>
  <div id="shopping-body">
    <p>選擇商品後，可在購物車確認到貨日與運費。</p>
    <p>客製造型餅乾請先提供日期、數量與參考照片，店家會回覆報價。</p>
  </div>
  <form method="dialog"><button type="submit" autofocus>關閉</button></form>
</dialog>
<script src="js/config.js?v=custom-cookie-icon"></script>
<script src="js/app.js?v=1122c"></script>
<script src="js/shop.js?v=1122c"></script>
<script>
  // top-left 「首頁」 always goes to the main menu; 返回上一頁 at the bottom goes back to wherever the customer came from
  NTC.$('#back2').addEventListener('click', (event) => {
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    NTC.back();
  });

  const filters = NTC.$('.store-filters');
  const buttons = [...filters.querySelectorAll('button')];
  const collections = NTC.$('#collections');
  const chinese = collections.querySelector('[data-group="chinese"]');
  let hasChinese = true;
  function filterCollections(category, name) {
    let count = 0;
    for (const collection of collections.children) {
      collection.hidden = (collection === chinese && !hasChinese) || (category !== 'all' && collection.dataset.collection !== category);
      if (!collection.hidden) count++;
    }
    NTC.$('#filter-status').textContent = `${name}，共 ${count} 個分類`;
  }
  filters.addEventListener('click', (event) => {
    const selected = event.target.closest('button[data-filter]');
    if (!selected || selected.getAttribute('aria-pressed') === 'true') return;
    const category = selected.dataset.filter;
    buttons.forEach((button) => button.setAttribute('aria-pressed', String(button === selected)));
    filterCollections(category, selected.textContent);
  });
  filters.hidden = false;

  const info = NTC.$('#shopping-info');
  const infoButton = NTC.$('#show-shopping-info');
  if (typeof info.showModal === 'function') {
    infoButton.addEventListener('click', () => info.showModal());
    infoButton.hidden = false;
  }
  NTC.mountCartBar();
  NTC.$('.cartbar .go').textContent = '去結帳';

  // 購物須知: written from the shop's settings; the owner can rewrite, hide or add notes in the admin (設定 → 購物須知)
  NTC.catalog().then((c) => {
    const cookie = c.settings.cookie || {};
    const live = (cookie.series || []).filter((series) => series.active);
    const cookieGroups = (cookie.groups || []).filter((group) => live.some((series) => (series.groups || []).includes(group.id)));
    hasChinese = cookieGroups.some((group) => group.id === 'chinese');
    const builtIn = new Set(['character', 'birthday', 'chinese']);
    const e = NTC.esc;
    for (const group of cookieGroups) {
      if (builtIn.has(group.id)) continue;
      const series = live.find((item) => (item.groups || []).includes(group.id) && (item.photo || item.photos?.[0]));
      const cover = series?.photo || series?.photos?.[0];
      const title = /餅乾$/.test(group.name) ? group.name : `${group.name}造型餅乾`;
      const tile = document.createElement('li');
      tile.className = 'store-feature';
      tile.dataset.collection = 'cookie';
      tile.innerHTML = `<a class="store-category-card${cover ? '' : ' no-photo'}" href="cookies.html?g=${encodeURIComponent(group.id)}">
        ${cover ? `<span class="store-category-photo"><img src="${e(NTC.asset(cover))}" alt="" loading="lazy"></span>` : ''}
        <span class="store-category-copy"><h2>${e(title)}</h2><span class="store-category-action">選購款式</span></span>
      </a>`;
      collections.append(tile);
    }
    // product lines the owner opened herself (admin → 商品 → ＋ 新增分類): one card each, as soon as something in it is on sale
    for (const line of c.settings.categories || []) {
      const items = c.products.filter((item) => item.category === line.id);
      if (!items.length) continue;
      const cover = line.photo || items.find((item) => item.photo)?.photo;
      const tile = document.createElement('li');
      tile.className = 'store-feature';
      tile.dataset.collection = line.temp === 'frozen' ? 'line' : 'gift';
      tile.dataset.line = line.id;
      tile.innerHTML = `<a class="store-category-card${cover ? '' : ' no-photo'}" href="category.html?c=${encodeURIComponent(line.id)}">
        ${cover ? `<span class="store-category-photo"><img src="${e(NTC.asset(cover))}" alt="" loading="lazy"></span>` : ''}
        <span class="store-category-copy"><h2>${e(line.name)}</h2><span class="store-category-action">選購商品</span></span>
      </a>`;
      collections.append(tile);
    }
    const active = filters.querySelector('[aria-pressed="true"]');
    filterCollections(active.dataset.filter, active.textContent);
    const rows = NTC.shopNotes(c.settings).filter((r) => !r.hidden && (r.title || r.text));
    NTC.$('#shopping-body').innerHTML = `<dl class="store-rules">${rows.map((r) => `<dt>${e(r.title)}</dt><dd>${e(r.text).replace(/\n/g, '<br>')}</dd>`).join('')}</dl>`;
    if (location.hash === '#notes' && typeof info.showModal === 'function') info.showModal(); // the admin's 「看客人看到的樣子」
  }).catch(() => {});
</script>
</body>
</html>
