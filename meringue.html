<style>
  .meringue-copy {
    margin: clamp(10px, 3.5vw, 22px) calc(22 * var(--u)) 0;
    padding: clamp(10px, 3vw, 18px) 10px clamp(13px, 3.5vw, 22px);
    border: 1.5px solid #fffaf5;
    border-radius: clamp(14px, 5vw, 30px);
    background: linear-gradient(145deg, #fcf0e7, #f9e9dd);
    color: #3b2216;
    text-align: center;
  }
  .meringue-copy-ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    max-width: 82%;
    margin: 0 auto 4px;
    color: #a56831;
    font: 500 clamp(17px, 4.6vw, 24px)/1 var(--serif);
  }
  .meringue-copy-ornament::before, .meringue-copy-ornament::after {
    content: "";
    flex: 1;
    border-top: 1px solid #c69365;

    margin: 0;
    font: 900 clamp(18px, 5.4vw, 29px)/1.35 var(--serif);

    margin: 5px 0 0;

<body>
<main class="dz dz-941">
  <h1 class="sr-only">馬林糖一口酥・送禮小點</h1>
  <header class="meringue-banner">
    <div class="meringue-toolbar">
      <button class="circle-btn" id="back" type="button" aria-label="返回上一頁"><span aria-hidden="true">←</span></button>
      <span class="meringue-brand">N.T Cookie × N.T Canelé</span>
      <a class="circle-btn" id="banner-cart" href="cart.html" aria-label="購物車"><span class="badge" data-cart-count></span></a>
      <button class="circle-btn" id="menu" type="button" aria-label="選單"><span aria-hidden="true">☰</span></button>
    </div>
    <div class="meringue-art"><img src="assets/v2/02-meringue/jar-and-bag-banner.jpg" width="1755" height="896" alt="馬林糖一口酥送禮小點，小罐禮盒與大包裝。法式手工，酥脆輕盈，甜而不膩。"></div>
  </header>
  <h2 class="meringue-flavors"><img src="assets/v2/02-meringue/flavor-heading.webp" width="638" height="81" alt="口味選擇"></h2>
  <nav class="pack-nav" id="packs" aria-label="選擇包裝">
    <span aria-current="page">小罐裝<span>約 120 g</span></span>
    <a href="meringue-bags.html">大包裝<span>超過 200 g</span></a>
  </nav>
  <!-- design 548–1496: the flavour cards (live from the shop's product list) -->
  <div class="seg grid-rows" id="grid" style="height:calc(948 * var(--u));background-image:url(assets/v2/page-meringue-mid.webp)"></div>
  <section class="meringue-copy" aria-labelledby="meringue-copy-title">
    <span class="meringue-copy-ornament" aria-hidden="true">♡</span>
    <h2 id="meringue-copy-title">雙重酥脆・香濃不膩</h2>
    <p>每款馬林糖搭配專屬的香酥餅乾底，<br>一口咬下，兩種酥脆。</p>
  </section>

<button type="button" class="nt-back" onclick="window.NTC && NTC.back ? NTC.back() : history.back()"><i aria-hidden="true"></i>返回上一頁</button>

<script>
  NTC.$('#back').onclick = NTC.back;
  NTC.$('#menu').onclick = NTC.openMenu;
  NTC.$('#banner-cart').insertAdjacentHTML('afterbegin', NTC.CART_SVG);
  NTC.mountCartBar();
  NTC.catalog().then((c) => NTC.renderGrid(NTC.$('#grid'), 'meringue', c.products.filter((p) => p.category === 'meringue' && p.unit !== '包')))
    .catch((e) => NTC.toast(e.message, 4000));
</script>
