<body>
<header class="topbar"><button class="circle-btn" id="back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1>我的訂單</h1><a class="circle-btn" href="cart.html" aria-label="購物車"><svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.1 10.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 8H6.2"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><span class="badge" data-cart-count></span></a></header>
<main class="wrap" id="app"><div class="spinner"></div></main>
<button type="button" class="nt-back" onclick="window.NTC && NTC.back ? NTC.back() : history.back()"><i aria-hidden="true"></i>返回上一頁</button>
<script src="js/config.js?v=1122c"></script>
<script src="js/app.js?v=1122d"></script>
<script src="js/shop.js?v=1122c"></script>
<script>
(async function () {
  const { $, esc, money } = NTC;
  $('#back').onclick = NTC.back;
  const app = $('#app');
  const row = (o, href) => `<a class="opt" style="text-decoration:none" href="${href}"><span class="t">${esc(o.orderNo || o.no)}<small>${o.date ? NTC.fmtDate(o.date) + '・' : ''}${money(o.total)}${o.lines ? '・' + esc(o.lines.map((l) => l.name).join('、')).slice(0, 40) : ''}</small></span>${o.statusLabel ? `<span class="status-pill ${esc(o.status)}">${esc(o.statusLabel)}</span>` : ''}<span class="r">›</span></a>`;
  let html = '';
  if (await NTC.loggedIn()) {
    try {
      const r = await NTC.api('/me');
      html += `<div class="panel"><div class="who" style="margin-bottom:12px">${r.user.picture ? `<img src="${esc(r.user.picture)}" alt="">` : ''}<b>${esc(r.user.name)}</b> 的訂單</div>
        ${r.orders.length ? r.orders.map((o) => row(o, `order.html?no=${o.orderNo}`)).join('') : '<p class="note">還沒有訂單</p>'}</div>`;
    } catch (e) { html += `<p class="err">${esc(e.message)}</p>`; }
  } else {
    html += '<div class="panel"><p class="note" style="margin:0 0 10px">用 LINE 登入，可以看到所有用這個 LINE 下的訂單。</p><button class="btn line block" id="login">用 LINE 登入</button></div>';
  }
  html += `<div class="panel"><h2>查詢訂單</h2><p class="note" style="margin:-4px 0 10px">輸入訂單編號和下單時填的手機，就能打開訂單、回報匯款。</p>
    <form id="lookup"><label class="field"><span>訂單編號</span><input id="lk-no" autocapitalize="characters" placeholder="例如 NT261118005" maxlength="20"></label>
    <label class="field"><span>手機</span><input id="lk-phone" type="tel" inputmode="tel" placeholder="09xx-xxx-xxx" maxlength="20"></label>
    <p class="err" id="lk-err" hidden></p><button class="btn block">查詢</button></form></div>`;
  let local = []; try { local = JSON.parse(localStorage.getItem('ntc-orders') || '[]'); } catch (e) { /* ignore */ }
  if (local.length) html += `<div class="panel"><h2>這支手機下過的訂單</h2>${local.map((o) => row({ no: o.no, total: o.total }, `order.html?no=${o.no}&t=${o.t}`)).join('')}</div>`;
  if (!html.includes('class="opt"')) html += '<div class="empty" style="padding:16px 10px"><p class="note">這支手機還沒有訂單紀錄</p><a class="btn small" href="shop.html">去逛逛</a></div>';
  app.innerHTML = html;
  const l = $('#login'); if (l) l.onclick = NTC.login;
  $('#lookup').onsubmit = async (e) => {
    e.preventDefault(); const err = $('#lk-err'); err.hidden = true;
    const no = $('#lk-no').value.trim(); const phone = $('#lk-phone').value.trim();
    if (!no || !phone) { err.textContent = '請填訂單編號和手機'; err.hidden = false; return; }
    NTC.loading(true, '查詢中…');
    try {
      const r = await NTC.api('/orders/lookup', { method: 'POST', body: { no, phone } });
      try { const list = JSON.parse(localStorage.getItem('ntc-orders') || '[]').filter((x) => x.no !== r.no); list.unshift({ no: r.no, t: r.t, total: r.total, at: Date.now() }); localStorage.setItem('ntc-orders', JSON.stringify(list.slice(0, 30))); } catch (x) { /* ignore */ }
      location.href = `order.html?no=${r.no}&t=${r.t}`;
    } catch (x) { NTC.loading(false); err.textContent = x.message; err.hidden = false; }
  };
  NTC.refreshCart();
})();
</script>
</body>
</html>
