<style>/* 11-23 h: one-tap copy of the order number */
.copy-no { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; padding: 0 11px; height: 30px; border: 0; border-radius: 999px; background: #f1e1d8; color: var(--brown); font: 700 12.5px/1 var(--sans); cursor: pointer; vertical-align: middle; -webkit-tap-highlight-color: transparent; }
.copy-no::before { content: ""; position: absolute; inset: -8px -6px; }
.copy-no svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.copy-no.done { background: #e3f2e6; color: #2f7a43; }
.ord { position: relative; }
.ord .ord-go { color: inherit; text-decoration: none; letter-spacing: .02em; }
.ord .ord-go::after { content: ""; position: absolute; inset: 0; border-radius: 14px; }
.order-no { user-select: all; -webkit-user-select: all; }

<title>我的訂單｜N.T Cookie × N.T Canelé</title>
<meta name="robots" content="noindex">
</head>
<body>
<header class="topbar"><button class="circle-btn" id="back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1>我的訂單</h1><a class="circle-btn" href="cart.html" aria-label="購物車"><svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.1 10.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 8H6.2"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><span class="badge" data-cart-count></span></a></header>
<main class="wrap" id="app"><div class="spinner"></div></main>
<button type="button" class="nt-back" onclick="window.NTC && NTC.back ? NTC.back() : history.back()"><i aria-hidden="true"></i>返回上一頁</button>
<script src="js/config.js?v=1124c"></script>
<script src="js/app.js?v=1124c"></script>
<script src="js/shop.js?v=1123k"></script>
<script>
(async function () {
  const { $, esc, money } = NTC;
  $('#back').onclick = NTC.back;
  const app = $('#app');
  // 11-23 h: copy, with a fallback for in-app browsers that block the clipboard API
  const copyText = async (v) => {
    try { await navigator.clipboard.writeText(v); return true; } catch (e) { /* fall through */ }
    const ta = document.createElement('textarea'); ta.value = v; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, v.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove(); return ok;
  };
  const COPY_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8.5" rx="1.6"/><path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v6A1.5 1.5 0 0 0 4 10.5h.5"/></svg>';
  const copyNoBtn = (v) => `<button type="button" class="copy-no" data-copy="${esc(v)}" data-what="訂單編號" aria-label="複製訂單編號 ${esc(v)}">${COPY_ICON}複製</button>`;
  const wireCopy = (root) => root.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = async (e) => {
    e.preventDefault(); e.stopPropagation();
    const v = b.dataset.copy;
    if (await copyText(v)) {
      NTC.toast(`已複製${b.dataset.what || ''}${b.dataset.what ? ' ' + v : ''}`);
      if (b.classList.contains('copy-no')) { b.classList.add('done'); b.lastChild.textContent = '已複製'; clearTimeout(b._t); b._t = setTimeout(() => { b.classList.remove('done'); b.lastChild.textContent = '複製'; }, 1600); }
    } else NTC.toast(`請長按選取：${v}`, 4000);
  }));
  const row = (o, href) => `<div class="opt ord"><span class="t"><a class="ord-go" href="${href}">${esc(o.orderNo || o.no)}</a>${copyNoBtn(o.orderNo || o.no)}<small>${o.date ? NTC.fmtDate(o.date) + '・' : ''}${money(o.total)}${o.lines ? '・' + esc(o.lines.map((l) => l.name).join('、')).slice(0, 40) : ''}</small></span>${o.statusLabel ? `<span class="status-pill ${esc(o.status)}">${esc(o.statusLabel)}</span>` : ''}<span class="r" aria-hidden="true">›</span></div>`;
  let html = '';
  if (await NTC.loggedIn()) {
    try {
      const r = await NTC.api('/me');
      html += `<div class="panel"><div class="who" style="margin-bottom:12px">${r.user.picture ? `<img src="${esc(r.user.picture)}" alt="">` : ''}<b>${esc(r.user.name)}</b> 的訂單</div>
        ${r.orders.length ? r.orders.map((o) => row(o, `order.html?no=${o.orderNo}`)).join('') : '<p class="note">還沒有訂單</p>'}</div>`;
    } catch (e) { html += `<p class="err">${esc(e.message)}</p>`; }
  } else {
    html += '<div class="panel"><p class="note" style="margin:0 0 10px">用 LINE 登入，可以看到所有用這個 LINE 下的訂單。</p><button class="btn line block" id="login">用 LINE 登入</button></div>';
  }
  html += `<div class="panel"><h2>查詢訂單</h2><p class="note" style="margin:-4px 0 10px">輸入訂單編號和下單時填的手機，就能打開訂單、回報匯款。</p>
    <form id="lookup"><label class="field"><span>訂單編號</span><input id="lk-no" autocapitalize="characters" placeholder="例如 NT261118005" maxlength="20"></label>
    <label class="field"><span>手機</span><input id="lk-phone" type="tel" inputmode="tel" placeholder="09xx-xxx-xxx" maxlength="20"></label>
    <p class="err" id="lk-err" hidden></p><button class="btn block">查詢</button></form></div>`;
  let local = []; try { local = JSON.parse(localStorage.getItem('ntc-orders') || '[]'); } catch (e) { /* ignore */ }
  if (local.length) html += `<div class="panel"><h2>這支手機下過的訂單</h2>${local.map((o) => row({ no: o.no, total: o.total }, `order.html?no=${o.no}&t=${o.t}`)).join('')}</div>`;
  if (!html.includes('class="opt"')) html += '<div class="empty" style="padding:16px 10px"><p class="note">這支手機還沒有訂單紀錄</p><a class="btn small" href="shop.html">去逛逛</a></div>';
  app.innerHTML = html;
  wireCopy(app);
  const l = $('#login'); if (l) l.onclick = NTC.login;
  $('#lookup').onsubmit = async (e) => {
    e.preventDefault(); const err = $('#lk-err'); err.hidden = true;
    const no = $('#lk-no').value.trim(); const phone = $('#lk-phone').value.trim();
    if (!no || !phone) { err.textContent = '請填訂單編號和手機'; err.hidden = false; return; }
    NTC.loading(true, '查詢中…');
    try {
      const r = await NTC.api('/orders/lookup', { method: 'POST', body: { no, phone } });
      try { const list = JSON.parse(localStorage.getItem('ntc-orders') || '[]').filter((x) => x.no !== r.no); list.unshift({ no: r.no, t: r.t, total: r.total, at: Date.now() }); localStorage.setItem('ntc-orders', JSON.stringify(list.slice(0, 30))); } catch (x) { /* ignore */ }
      location.href = `order.html?no=${r.no}&t=${r.t}`;
    } catch (x) { NTC.loading(false); err.textContent = x.message; err.hidden = false; }
  };
  NTC.refreshCart();
})();
</script>
</body>
